const SAFE_JOB_COLUMNS='id,customer_id,source_lead_id,source_quote_id,customer,phone,address,job_name,system_type,square_feet,status,start_date,start_time,end_date,end_time,crew,notes,material_notes,material_list,custom_materials,floor_scopes,google_calendar_sync_status,google_calendar_sync_error';

function val(id){return $(id)?.value||''}
function cleanTime(t){return String(t||'').slice(0,5)}
function today(){return new Date().toISOString().slice(0,10)}
function dateObj(d){return new Date((d||today())+'T00:00:00')}
function isoDate(d){return d.toISOString().slice(0,10)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function dateDiff(a,b){return Math.round((dateObj(b)-dateObj(a))/86400000)}
function normalizeJobScheduleState(p={},rec={}){
 let status=p.status||rec.status||'',start=p.start_date||'',terminal=['Complete','Lost','Canceled','Needs Review','Sync Conflict'];
 if(start&&start>=today()&&!terminal.includes(status)){p.status='Scheduled';if(!p.end_date)p.end_date=start;return p}
 if(status==='Awaiting Schedule'){
  p.status='Awaiting Schedule';p.start_date=null;p.start_time=null;p.end_date=null;p.end_time=null;return p;
 }
 if(p.start_date&&!p.end_date)p.end_date=p.start_date;
 return p;
}
function jobScheduleTerminalStatus(status){return ['Complete','Lost','Canceled','Needs Review','Sync Conflict'].includes(status)}
function scheduleSpanDays(rec){return rec?.start_date?Math.max(0,dateDiff(rec.start_date,rec.end_date||rec.start_date)):0}
function syncEndDateToScheduleSpan(input){let end=$('end_date'),span=Number(input.dataset.scheduleSpanDays||0);if(input.value&&end)end.value=isoDate(addDays(dateObj(input.value),span))}

function fieldMeasureUrl(){let u=new URL('mobile-measure.html',location.href);u.searchParams.set('type','job');u.searchParams.set('id',jobId);return u.href}
function jobLink(id,hash=''){let u=new URL('mobile-job.html',location.href);u.searchParams.set('job',id);u.searchParams.set('crew','1');u.hash=hash;return u.href}
function floorScopes(){let scopes=Array.isArray(job?.floor_scopes)?job.floor_scopes:[];return scopes.length?scopes:[{floor:'',area_name:'',system:job.system_type||'',sqft:job.square_feet||0,options:{},option_details:[],notes:[]}]}
function hasSavedFloorScopes(){return Array.isArray(job?.floor_scopes)&&job.floor_scopes.length>1}
function floorTotals(){let scopes=floorScopes();return {system_type:scopes.map(f=>f.system).filter(Boolean).join(', '),square_feet:scopes.reduce((sum,f)=>sum+(+f.sqft||0),0)}}
function scopeTitle(f){return `${f.floor?`Floor ${esc(f.floor)}${f.area_name?` - ${esc(f.area_name)}`:''}: `:''}${esc(f.system||'System')}`}
function optionDetailsHTML(f){let details=Array.isArray(f?.option_details)?f.option_details:[];return details.length?`<div class=muted>${details.map(esc).join(' | ')}</div>`:''}
function scopeHTML(){return `<div class=scope-grid>${floorScopes().map(f=>`<div class=scope><b>${scopeTitle(f)}</b><span>${esc(f.sqft||0)} sq ft</span>${optionDetailsHTML(f)}</div>`).join('')}</div>`}
function photoUrl(p){if(p?.public_url)return p.public_url;if(p?.storage_path)try{return supa.storage.from('sefs-photos').getPublicUrl(p.storage_path).data.publicUrl||''}catch(e){return ''}return ''}
function isFilePdf(p,url=''){return /\.pdf($|[?#])/i.test([p?.file_name,p?.storage_path,p?.public_url,url].filter(Boolean).join(' '))}
function attachmentHTML(p,label='Attachment'){let u=photoUrl(p);if(!u)return '';let name=p.caption||p.file_name||label,body=isFilePdf(p,u)?`<a class=attachment-file href="${esc(u)}" target=_blank rel=noopener><b>PDF</b><span>${esc(name)}</span></a>`:`<a href="${esc(u)}" target=_blank rel=noopener><img class=photo src="${esc(u)}" alt="${esc(name)}"></a>`;return `<span class=attachment-wrap>${body}${p.id?`<button type=button class=attachment-delete title="Delete attachment" onclick="deleteAttachment('${esc(p.id)}')">x</button>`:''}</span>`}
let queuedFiles=[];
function safeStorageName(name){return String(name||'file').replace(/[^a-zA-Z0-9._-]/g,'_')}
function inferFileType(file){let name=String(file?.name||'').toLowerCase();if(file?.type)return file.type;if(name.endsWith('.pdf'))return 'application/pdf';if(/\.(jpe?g)$/i.test(name))return 'image/jpeg';if(name.endsWith('.png'))return 'image/png';if(name.endsWith('.heic'))return 'image/heic';if(name.endsWith('.webp'))return 'image/webp';return 'application/octet-stream'}
const IMAGE_UPLOAD_MAX_SIDE=2400,IMAGE_UPLOAD_QUALITY=.78,LARGE_UPLOAD_WARN_BYTES=10*1024*1024;
function isCompressibleImage(file){let type=String(file?.type||'').toLowerCase(),name=String(file?.name||'').toLowerCase();return (type.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(name))&&!/image\/(gif|svg\+xml)/i.test(type)}
function compressedImageName(name){return safeStorageName(name||'photo.jpg').replace(/\.[^.]+$/,'')+'.jpg'}
async function prepareUploadFile(file){if(!isCompressibleImage(file))return file;try{let url=URL.createObjectURL(file),img=await new Promise((resolve,reject)=>{let image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image could not be compressed'))};image.src=url});let width=img.naturalWidth||img.width,height=img.naturalHeight||img.height,scale=Math.min(1,IMAGE_UPLOAD_MAX_SIDE/Math.max(width,height));if(scale>=1&&file.size<900*1024)return file;let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',IMAGE_UPLOAD_QUALITY));if(!blob)return file;let compressed=new File([blob],compressedImageName(file.name),{type:'image/jpeg',lastModified:Date.now()});return compressed.size<file.size?compressed:file}catch(e){console.warn('Image compression skipped',e?.message||e);return file}}
function confirmLargeUploads(files){let large=Array.from(files||[]).filter(file=>!isCompressibleImage(file)&&file.size>LARGE_UPLOAD_WARN_BYTES);return !large.length||confirm(`${large.length} large non-photo file${large.length===1?' is':'s are'} over 10 MB and may upload slowly. Continue?`)}
function fileSize(bytes){bytes=Number(bytes)||0;if(bytes>1048576)return `${(bytes/1048576).toFixed(1)} MB`;if(bytes>1024)return `${Math.round(bytes/1024)} KB`;return `${bytes} B`}
function renderQueuedFiles(){let box=$('queuedFiles');if(!box)return;box.innerHTML=queuedFiles.length?queuedFiles.map((f,i)=>`<div class=queued-file><span>${esc(f.name)} <span class=muted>${fileSize(f.size)}</span></span><button type=button class=secondary onclick="removeQueuedFile(${i})">Remove</button></div>`).join(''):'<div class=muted>No files queued yet. You can choose more than once before uploading.</div>'}
function queueFiles(input){for(const file of Array.from(input.files||[])){let key=[file.name,file.size,file.lastModified].join('|');if(!queuedFiles.some(x=>[x.name,x.size,x.lastModified].join('|')===key))queuedFiles.push(file)}input.value='';renderQueuedFiles()}
function removeQueuedFile(index){queuedFiles.splice(index,1);renderQueuedFiles()}
function photoKey(p){return [p.storage_path||'',p.public_url||'',p.file_name||'',p.field_measurement_id||'',p.field_measurement_area_id||''].join('|')}
function dedupePhotos(rows){let seen=new Set(),out=[];for(const p of rows||[]){let k=photoKey(p);if(seen.has(k))continue;seen.add(k);out.push(p)}return out.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))}
async function fetchRelatedJobPhotos(){
  let rows=[],pairs=[`job:${jobId}`],mids=new Set(),addPair=(t,id)=>{if(t&&id&&!pairs.includes(`${t}:${id}`))pairs.push(`${t}:${id}`)};
  addPair('lead',job?.source_lead_id);addPair('quote',job?.source_quote_id);addPair('customer',job?.customer_id);
  try{
    let quotes=await supa.from('quotes').select('id,lead_id,job_id,customer_id,quote_json').or(`job_id.eq.${jobId}${job?.source_quote_id?`,id.eq.${job.source_quote_id}`:''}`);
    (quotes.data||[]).forEach(q=>{addPair('quote',q.id);addPair('lead',q.lead_id);addPair('customer',q.customer_id);let data=q.quote_json||{},ids=[data.source_measurement_id,data.source_measurement?.id];(data.floors||[]).forEach(f=>ids.push(f.field_measurement_id));ids.filter(Boolean).forEach(id=>mids.add(id))});
  }catch(e){console.warn('Quote photo lookup skipped',e?.message||e)}
  try{
    let measures=await supa.from('field_measurements').select('id,job_id,lead_id').eq('job_id',jobId);
    (measures.data||[]).forEach(m=>{if(m.id)mids.add(m.id);addPair('lead',m.lead_id)});
  }catch(e){console.warn('Measurement photo lookup skipped',e?.message||e)}
  try{
    let ids=[...new Set(pairs.map(x=>x.split(':')[1]).filter(Boolean))];
    if(ids.length){let r=await supa.from('photo_attachments').select('id,entity_type,entity_id,file_name,storage_path,public_url,caption,category,field_measurement_id,field_measurement_area_id,created_at').in('entity_id',ids).order('created_at',{ascending:false});if(!r.error)rows.push(...(r.data||[]).filter(p=>pairs.includes(`${p.entity_type}:${p.entity_id}`)))}
  }catch(e){console.warn('Related photo lookup skipped',e?.message||e)}
  try{
    let ids=[...mids].filter(Boolean);
    if(ids.length){let r=await supa.from('photo_attachments').select('id,entity_type,entity_id,file_name,storage_path,public_url,caption,category,field_measurement_id,field_measurement_area_id,created_at').in('field_measurement_id',ids).order('created_at',{ascending:false});if(!r.error)rows.push(...(r.data||[]))}
  }catch(e){console.warn('Measurement photos lookup skipped',e?.message||e)}
  return dedupePhotos(rows);
}
function jobMaterialList(){let base=Array.isArray(job?.material_list)?job.material_list:[],custom=Array.isArray(job?.custom_materials)?job.custom_materials:[];return [...base,...custom].filter(m=>m&&String(m.name||'').trim())}

function materialListHTML(){let list=jobMaterialList(),groups=floorScopes();if(!list.length)return '<div class=muted>No material list has been saved for this job yet.</div>';let disclaimer=estimatedMaterials()?'<div class=estimate-disclaimer>Estimated material list only. This job was not created from a quoted material sheet, so verify materials and quantities before pulling, ordering, or loading the truck.</div>':'';let used=new Set(),html=groups.map((f,idx)=>{let items=list.filter((m,i)=>{let sameFloor=String(m.floor||'')===String(f.floor||'')||String(m.floor||'')===String(idx+1),sameSystem=String(m.system||'').trim()&&String(m.system||'').trim()===String(f.system||'').trim(),singleGroup=groups.length===1&&!m.custom;let ok=sameFloor||(!m.floor&&sameSystem)||singleGroup;if(ok)used.add(i);return ok});return `<h3>${scopeTitle(f)} - ${esc(f.sqft||0)} SQ FT</h3>${optionDetailsHTML(f)}${items.length?`<table><tr><th>Material</th><th>Qty</th></tr>${items.map(m=>`<tr><td>${m.custom?'Custom: ':''}${esc(m.name||'Material')}</td><td>${esc(materialQtyText(m))}</td></tr>`).join('')}</table>`:'<p class=muted>No coating materials required.</p>'}${(f.notes||[]).map(n=>`<p>${esc(n)}</p>`).join('')}`}).join('');let ungrouped=list.filter((m,i)=>!used.has(i));if(ungrouped.length)html+=`<h3>Additional Materials</h3><table><tr><th>Material</th><th>Qty</th></tr>${ungrouped.map(m=>`<tr><td>${m.custom?'Custom: ':''}${esc(m.name||'Material')}</td><td>${esc(materialQtyText(m))}</td></tr>`).join('')}</table>`;return disclaimer+html}
async function loadJob(){if(!jobId){await loadJobPicker();return}setStatus('Loading job...');let r=await supa.from('jobs').select(SAFE_JOB_COLUMNS).eq('id',jobId).maybeSingle();if(r.error){setStatus(r.error.message,'bad');$('app').innerHTML=`<div class=card><h2>Could not load job</h2><p class=muted>${esc(r.error.message)}</p><a class=secondary href="mobile-job.html">Choose another job</a></div>`;return}if(!r.data){setStatus('Job not found.','bad');$('app').innerHTML=`<div class=card><h2>Job not found</h2><p class=muted>This link does not match an active dashboard job.</p><a class=secondary href="mobile-job.html">Choose another job</a></div>`;return}job=r.data;photos=await fetchRelatedJobPhotos();render();setStatus('Loaded','ok')}
async function loadJobPicker(){setStatus('Loading jobs...');let statuses=['Awaiting Schedule','Awaiting Follow Up','Scheduled','In Progress','Waiting','Needs Review'];let r=await supa.from('jobs').select(PICKER_JOB_COLUMNS).in('status',statuses).order('start_date',{ascending:true});if(r.error){setStatus(r.error.message,'bad');$('app').innerHTML=`<div class=card><h2>Could not load jobs</h2><p class=muted>${esc(r.error.message)}</p></div>`;return}let jobs=r.data||[];$('title').textContent='SEFS Jobs';$('subtitle').textContent='Choose a job to open';$('app').innerHTML=`<div class=card><h2>Choose Job</h2><p class=muted>Open a scheduled or active job. This crew view does not show quote pricing.</p>${jobs.length?`<div class=scope-grid>${jobs.map(j=>`<a class=secondary href="${jobLink(j.id)}"><b>${esc(j.job_name||j.customer||'Job')}</b><br><span>${esc(j.system_type||'System')} - ${esc(j.status||'')}</span><br><span>${esc([j.start_date,cleanTime(j.start_time)].filter(Boolean).join(' '))}</span><br><span>${esc(j.address||'')}</span></a>`).join('')}</div>`:'<div class=muted>No active jobs are available.</div>'}</div>`;setStatus(jobs.length?'Choose a job':'No active jobs','ok')}
function editableJobHTML(totals,multi){return `<form id=form class="card no-print"><label>Customer</label><input id=customer value="${esc(job.customer||'')}"><label>Phone</label><input id=phone type=tel value="${esc(job.phone||'')}"><label>Address</label><textarea id=address autocomplete="street-address" rows="3">${esc(job.address||'')}</textarea><div class=two><div><label>Start Date</label><input id=start_date type=date value="${esc(job.start_date||'')}" onchange="handleJobStartDateChange(this)" data-schedule-span-days="${scheduleSpanDays(job)}"></div><div><label>Start Time</label><input id=start_time type=time value="${esc(cleanTime(job.start_time))}"></div></div><div class=two><div><label>End Date</label><input id=end_date type=date value="${esc(job.end_date||job.start_date||'')}"></div><div><label>End Time</label><input id=end_time type=time value="${esc(cleanTime(job.end_time))}"></div></div><label>System / Type</label><input id=system_type value="${esc(totals.system_type||job.system_type||'')}" ${multi?'readonly':''}>${multi?'<div class=muted>Multi-floor system details are preserved below.</div>':''}<label>Total Square Feet</label><input id=square_feet type=number value="${esc(totals.square_feet||job.square_feet||0)}" ${multi?'readonly':''}><label>Status</label><select id=status_field onchange="handleJobStatusChange(this)">${['Awaiting Schedule','Awaiting Follow Up','Scheduled','In Progress','Waiting','Needs Review','Canceled','Complete'].map(s=>`<option ${job.status===s?'selected':''}>${s}</option>`).join('')}</select><label>Crew Notes</label><textarea id=notes>${esc(job.notes||'')}</textarea><label>Pull Sheet / Material Notes</label><textarea id=material_notes>${esc(job.material_notes||'')}</textarea><button class=primary>Save Job</button><a class=secondary href="${fieldMeasureUrl()}">Open Field Measure</a></form>`}
function crewJobHTML(totals){return `<div class="card no-print"><h2>Job Details</h2><div class=scope-grid><div class=scope><b>When</b><span>${esc([job.start_date,cleanTime(job.start_time)].filter(Boolean).join(' '))}${job.end_date&&job.end_date!==job.start_date?` - ${esc(job.end_date)}`:''}</span></div><div class=scope><b>Address</b><span>${addressLink(job.address)}</span></div><div class=scope><b>System / Type</b><span>${esc(totals.system_type||job.system_type||'-')}</span></div><div class=scope><b>Square Feet</b><span>${esc(totals.square_feet||job.square_feet||0)}</span></div><div class=scope><b>Status</b><span>${esc(job.status||'-')}</span></div><div class=scope><b>Crew</b><span>${esc(job.crew||'-')}</span></div></div>${job.notes?`<label>Existing Notes</label><div class=scope>${esc(job.notes)}</div>`:''}<label>Add Job Note</label><textarea id=crew_note placeholder="Add crew notes, prep concerns, or job updates."></textarea><button class=primary onclick="saveCrewNote(this)">Save Note</button><p class=muted>Schedule dates and job details are read-only from employee portal links.</p></div>`}
function render(){document.title=`SEFS Job - ${job.customer||job.job_name||''}`;$('title').textContent=job.customer||job.job_name||'SEFS Job';let totals=floorTotals(),multi=hasSavedFloorScopes();$('subtitle').textContent=[totals.system_type||job.system_type,job.start_date,crewOnly?'Crew read-only view':'Mobile crew view'].filter(Boolean).join(' - ');let jobControls=crewOnly?crewJobHTML(totals):editableJobHTML(totals,multi);$('app').innerHTML=`${jobControls}<div class=card><h2>Systems / Areas</h2>${scopeHTML()}</div><div id=materials class="card sheet"><h2>Materials Needed</h2><div class=muted>${esc(job.customer||'')} ${job.address?'- '+esc(job.address):''}</div><button class="secondary no-print" onclick="window.print()">Print / Save PDF</button><a class="secondary no-print" href="employee-portal.html">Employee Portal</a>${materialListHTML()}</div><div class="card photo-card"><h2>Photos / Files</h2><div class=muted>Photos and PDFs from the linked lead, quote, field measurement, and job are shown here.</div><input id=photoInput type=file accept="image/*,application/pdf,.pdf" multiple onchange="queueFiles(this)"><div id=queuedFiles class=queued-files></div><input id=caption placeholder="Caption / file note"><button id=uploadBtn class=secondary onclick="uploadPhotos()">Upload File</button><div class=photo-grid>${photos.map(p=>attachmentHTML(p,'Job attachment')).join('')||'<div class=muted>No photos or files yet.</div>'}</div></div>`;renderQueuedFiles();if(!crewOnly)$('form').onsubmit=saveJob;if(location.hash==='#materials')setTimeout(()=>$('materials')?.scrollIntoView(),100)}
async function saveCrewNote(button){return withButtonBusy(button,'Saving...',async()=>{let note=val('crew_note').trim();if(!note)return setStatus('Add a note first.','bad');setStatus('Saving note...');let author='employee portal',stamp=new Date().toLocaleString(),addition=`Employee portal note - ${stamp} - ${author}: ${note}`,notes=[job.notes,addition].filter(Boolean).join('\n');let r=await supa.from('jobs').update({notes}).eq('id',jobId).select(SAFE_JOB_COLUMNS).single();if(r.error){setStatus(r.error.message,'bad');return}job=r.data;render();setStatus('Note saved','ok')})}
async function saveJob(e){e.preventDefault();let button=e.submitter||e.target?.querySelector?.('button.primary');return withButtonBusy(button,'Saving...',async()=>{setStatus('Saving...');let totals=floorTotals(),multi=hasSavedFloorScopes();let payload=normalizeJobScheduleState({customer:val('customer'),phone:val('phone'),address:val('address'),start_date:val('start_date')||null,start_time:val('start_time')||null,end_date:val('end_date')||null,end_time:val('end_time')||null,system_type:multi?totals.system_type:val('system_type'),square_feet:multi?totals.square_feet:Number(val('square_feet')||0),status:val('status_field'),notes:val('notes'),material_notes:val('material_notes'),google_calendar_sync_status:'Not Synced',google_calendar_sync_error:null},job);let r=await supa.from('jobs').update(payload).eq('id',jobId).select(SAFE_JOB_COLUMNS).single();if(r.error){setStatus(r.error.message,'bad');return}job=r.data;setStatus('Saved. Open dashboard sync will update Google Calendar.','ok');render()})}
async function uploadPhotos(){let f=$('photoInput'),cap=val('caption');if(f?.files?.length)queueFiles(f);if(!queuedFiles.length)return setStatus('Choose a file first.','bad');if(!confirmLargeUploads(queuedFiles))return setStatus('Upload canceled.','bad');let btn=$('uploadBtn');return withButtonBusy(btn,'Uploading...',async()=>{setStatus('Uploading files...');try{for(const file of queuedFiles){let uploadFile=await prepareUploadFile(file),path=`job/${jobId}/${Date.now()}_${safeStorageName(uploadFile.name)}`;let up=await supa.storage.from('sefs-photos').upload(path,uploadFile,{upsert:false,cacheControl:'3600',contentType:inferFileType(uploadFile)});if(up.error)throw new Error(up.error.message||'Upload failed');let pub=supa.storage.from('sefs-photos').getPublicUrl(path).data.publicUrl;let saved=await supa.from('photo_attachments').insert({entity_type:'job',entity_id:jobId,file_name:uploadFile.name,storage_path:path,public_url:pub,caption:cap,uploaded_by:'mobile'});if(saved.error)throw new Error(saved.error.message)}}catch(e){setStatus(e.message||'Upload failed. Try the file again after it finishes loading on the phone.','bad');return}queuedFiles=[];await loadJob();setStatus('Files uploaded','ok');alert('Files uploaded.')})}
async function deleteAttachment(id){let p=photos.find(x=>String(x.id)===String(id));if(!p)return setStatus('Attachment not found. Refresh and try again.','bad');if(!confirm(`Delete ${p.file_name||p.caption||'this attachment'}?`))return;setStatus('Deleting attachment...');let del=await supa.from('photo_attachments').delete().eq('id',id);if(del.error){setStatus(del.error.message,'bad');return}if(p.storage_path){let used=await supa.from('photo_attachments').select('id').eq('storage_path',p.storage_path).limit(1);if(!used.error&&!(used.data||[]).length)try{await supa.storage.from('sefs-photos').remove([p.storage_path])}catch(e){console.warn('Storage cleanup skipped',e?.message||e)}}await loadJob();setStatus('Attachment deleted','ok')}
loadJob();
</script></body></html>
