<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SEFS Job</title><link rel="icon" type="image/jpeg" href="assets/sefs-icon.jpeg"><link rel="apple-touch-icon" href="assets/sefs-icon.jpeg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--o:#ff7900;--g:#2bb673;--r:#d84242;--bg:#050505;--p:#151515;--l:#383838;--m:#aaa}*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif}header{position:sticky;top:0;z-index:2;background:#000;border-bottom:1px solid #333;padding:14px 16px}h1{font-size:21px;margin:0;color:#fff}.sub{color:#aaa;font-size:13px;margin-top:4px}main{padding:14px;max-width:760px;margin:0 auto}.card{background:#121212;border:1px solid #333;border-radius:10px;padding:14px;margin-bottom:12px}.sheet h2{margin:0 0 4px}.sheet h3{color:var(--o);margin:18px 0 8px}.sheet table{width:100%;border-collapse:collapse;margin-bottom:10px}.sheet th,.sheet td{border-bottom:1px solid #333;text-align:left;padding:9px 7px}.sheet th{background:#090909;color:#bbb;text-transform:uppercase;font-size:12px}.scope-grid{display:grid;gap:8px}.scope{border:1px solid #333;border-radius:8px;padding:10px;background:#0b0b0b}.scope b{display:block}.scope span{color:#aaa}label{display:block;margin:12px 0 6px;color:#bbb;font-size:12px;font-weight:900;text-transform:uppercase}input,select,textarea{width:100%;background:#090909;color:#eee;border:1px solid #444;border-radius:8px;padding:12px;font-size:16px}textarea{min-height:96px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{width:100%;border:0;border-radius:9px;padding:13px;margin-top:12px;font-weight:900}.primary{background:linear-gradient(90deg,var(--o),#ff9b28);color:#000}.secondary{background:#181818;border:1px solid var(--o);color:var(--o)}a.secondary{display:block;text-align:center;text-decoration:none}#status{border:1px solid #444;border-radius:99px;padding:8px 10px;color:#aaa;font-size:13px;margin-top:10px}#status.ok{border-color:var(--g);color:var(--g)}#status.bad{border-color:var(--r);color:#ff9999}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.photo{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:8px;border:1px solid #444}.muted{color:#aaa;font-size:13px}.hidden{display:none}@media(min-width:680px){.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media print{body{background:#fff;color:#111}header,.no-print,form,.photo-card{display:none!important}main{max-width:none;padding:0}.card{border:0;background:#fff;color:#111}.sheet th,.sheet td{border-bottom:1px solid #aaa}.sheet th{background:#eee;color:#111}.sheet h3{color:#000}}
</style></head><body><header><h1 id=title>SEFS Job</h1><div class=sub id=subtitle>Mobile crew view</div><div id=status>Loading...</div></header><main><div id=app></div></main><script>
const SB_URL='https://wjfewzutxvjbbnnvbylo.supabase.co', SB_KEY='sb_publishable_YWRQJz8q1lDdSz_304AUyA_YskIiTBT', supa=supabase.createClient(SB_URL,SB_KEY);
const SAFE_JOB_COLUMNS='id,customer,phone,address,job_name,system_type,square_feet,status,start_date,start_time,end_date,end_time,crew,notes,material_notes,material_list,floor_scopes,google_calendar_sync_status,google_calendar_sync_error';
const $=id=>document.getElementById(id), jobId=new URLSearchParams(location.search).get('job');
let job=null, photos=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStatus(t,c=''){$('status').textContent=t;$('status').className=c}
function val(id){return $(id)?.value||''}
function cleanTime(t){return String(t||'').slice(0,5)}
function fieldMeasureUrl(){let u=new URL('index.html',location.href);u.hash=`field_measure:job:${jobId}`;return u.href}
function floorScopes(){let scopes=Array.isArray(job?.floor_scopes)?job.floor_scopes:[];return scopes.length?scopes:[{floor:'',system:job.system_type||'',sqft:job.square_feet||0,notes:[]}]}
function scopeHTML(){return `<div class=scope-grid>${floorScopes().map(f=>`<div class=scope><b>${f.floor?`Floor ${esc(f.floor)}: `:''}${esc(f.system||'System')}</b><span>${esc(f.sqft||0)} sq ft</span></div>`).join('')}</div>`}
function materialListHTML(){let list=Array.isArray(job?.material_list)?job.material_list:[],groups=floorScopes();if(!list.length)return '<div class=muted>No material list has been saved for this job yet.</div>';return groups.map(f=>{let items=list.filter(m=>String(m.floor||'')===String(f.floor||'')||(!m.floor&&m.system===f.system));return `<h3>${f.floor?`Floor ${esc(f.floor)}: `:''}${esc(f.system||'System')} - ${esc(f.sqft||0)} SQ FT</h3>${items.length?`<table><tr><th>Material</th><th>Qty</th></tr>${items.map(m=>`<tr><td>${esc(m.name||'Material')}</td><td>${esc(m.qty||'')}</td></tr>`).join('')}</table>`:'<p class=muted>No coating materials required.</p>'}${(f.notes||[]).map(n=>`<p>${esc(n)}</p>`).join('')}`}).join('')}
async function loadJob(){if(!jobId){setStatus('Missing job link.','bad');return}setStatus('Loading job...');let r=await supa.from('jobs').select(SAFE_JOB_COLUMNS).eq('id',jobId).maybeSingle();if(r.error){setStatus(r.error.message,'bad');return}if(!r.data){setStatus('Job not found.','bad');return}job=r.data;let p=await supa.from('photo_attachments').select('id,entity_type,entity_id,file_name,storage_path,public_url,caption,created_at').eq('entity_type','job').eq('entity_id',jobId).order('created_at',{ascending:false});photos=p.data||[];render();setStatus('Loaded','ok')}
function render(){document.title=`SEFS Job - ${job.customer||job.job_name||''}`;$('title').textContent=job.customer||job.job_name||'SEFS Job';$('subtitle').textContent=[job.system_type,job.start_date].filter(Boolean).join(' - ')||'Mobile crew view';$('app').innerHTML=`<form id=form class="card no-print"><label>Customer</label><input id=customer value="${esc(job.customer||'')}"><label>Phone</label><input id=phone type=tel value="${esc(job.phone||'')}"><label>Address</label><textarea id=address>${esc(job.address||'')}</textarea><div class=two><div><label>Start Date</label><input id=start_date type=date value="${esc(job.start_date||'')}"></div><div><label>Start Time</label><input id=start_time type=time value="${esc(cleanTime(job.start_time))}"></div></div><div class=two><div><label>End Date</label><input id=end_date type=date value="${esc(job.end_date||job.start_date||'')}"></div><div><label>End Time</label><input id=end_time type=time value="${esc(cleanTime(job.end_time))}"></div></div><label>System / Type</label><input id=system_type value="${esc(job.system_type||'')}"><label>Total Square Feet</label><input id=square_feet type=number value="${esc(job.square_feet||0)}"><label>Status</label><select id=status_field>${['Awaiting Schedule','Awaiting Follow Up','Scheduled','In Progress','Waiting','Needs Review','Canceled','Complete'].map(s=>`<option ${job.status===s?'selected':''}>${s}</option>`).join('')}</select><label>Crew Notes</label><textarea id=notes>${esc(job.notes||'')}</textarea><label>Pull Sheet / Material Notes</label><textarea id=material_notes>${esc(job.material_notes||'')}</textarea><button class=primary>Save Job</button><a class=secondary href="${fieldMeasureUrl()}">Open Field Measure</a></form><div class=card><h2>Systems / Areas</h2>${scopeHTML()}</div><div id=materials class="card sheet"><h2>Materials Needed</h2><div class=muted>${esc(job.customer||'')} ${job.address?'- '+esc(job.address):''}</div><button class="secondary no-print" onclick="window.print()">Print / Save PDF</button>${materialListHTML()}</div><div class="card photo-card"><h2>Photos</h2><div class=muted>Photos upload directly to this job.</div><input id=photoInput type=file accept="image/*" capture=environment multiple><input id=caption placeholder="Photo caption"><button class=secondary onclick="uploadPhotos()">Upload Photos</button><div class=photo-grid>${photos.map(p=>`<a href="${esc(p.public_url)}" target=_blank><img class=photo src="${esc(p.public_url)}" alt="${esc(p.caption||p.file_name||'Job photo')}"></a>`).join('')}</div></div>`;$('form').onsubmit=saveJob;if(location.hash==='#materials')setTimeout(()=>$('materials')?.scrollIntoView(),100)}
async function saveJob(e){e.preventDefault();setStatus('Saving...');let payload={customer:val('customer'),phone:val('phone'),address:val('address'),start_date:val('start_date')||null,start_time:val('start_time')||null,end_date:val('end_date')||null,end_time:val('end_time')||null,system_type:val('system_type'),square_feet:Number(val('square_feet')||0),status:val('status_field'),notes:val('notes'),material_notes:val('material_notes'),google_calendar_sync_status:'Not Synced',google_calendar_sync_error:null};let r=await supa.from('jobs').update(payload).eq('id',jobId).select(SAFE_JOB_COLUMNS).single();if(r.error){setStatus(r.error.message,'bad');return}job=r.data;setStatus('Saved. Open dashboard sync will update Google Calendar.','ok');render()}
async function uploadPhotos(){let f=$('photoInput'),cap=val('caption');if(!f.files.length)return setStatus('Choose a photo first.','bad');setStatus('Uploading photos...');for(const file of f.files){let path=`job/${jobId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let up=await supa.storage.from('sefs-photos').upload(path,file,{upsert:false});if(up.error){setStatus(up.error.message,'bad');return}let pub=supa.storage.from('sefs-photos').getPublicUrl(path).data.publicUrl;let saved=await supa.from('photo_attachments').insert({entity_type:'job',entity_id:jobId,file_name:file.name,storage_path:path,public_url:pub,caption:cap,uploaded_by:'mobile'});if(saved.error){setStatus(saved.error.message,'bad');return}}await loadJob();setStatus('Photos uploaded','ok')}
loadJob();
</script></body></html>
