<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SEFS Mobile Measure</title>
  <link rel="manifest" href="mobile-measure.webmanifest?v=20260811e">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SEFS Measure">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/jpeg" href="assets/sefs-icon.jpeg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/sefs-app-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/sefs-app-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/sefs-app-icon-180.png">
  <script defer src="pwa-init.js?v=20260811e"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--o:#ff7900;--g:#2bb673;--r:#d84242;--bg:#050505;--p:#151515;--l:#383838;--m:#aaa}
    *{box-sizing:border-box}
    body{margin:0;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif}
    header{position:sticky;top:0;z-index:2;background:#000;border-bottom:1px solid #333;padding:14px 16px}
    h1{font-size:21px;margin:0;color:#fff}
    h2{margin:0 0 12px}
    .sub{color:#aaa;font-size:13px;margin-top:4px}
    main{padding:14px;max-width:760px;margin:0 auto}
    .card{background:#121212;border:1px solid #333;border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
    label{display:block;margin:12px 0 6px;color:#bbb;font-size:12px;font-weight:900;text-transform:uppercase}
    input,select,textarea{width:100%;background:#090909;color:#eee;border:1px solid #444;border-radius:8px;padding:12px;font-size:16px}
    input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(55%) sepia(96%) saturate(1900%) hue-rotate(1deg) brightness(104%) contrast(104%);opacity:1}
    textarea{min-height:96px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .primary,.secondary,.danger{width:100%;border-radius:9px;padding:13px;margin-top:12px;font-weight:900}
    .primary{border:0;background:linear-gradient(90deg,var(--o),#ff9b28);color:#000}
    .secondary{background:#181818;border:1px solid var(--o);color:var(--o)}
    .danger{background:#1b0909;border:1px solid var(--r);color:#ff9999}
    a.secondary{display:block;text-align:center;text-decoration:none}
    #status{border:1px solid #444;border-radius:99px;padding:8px 10px;color:#aaa;font-size:13px;margin-top:10px}
    #status.ok{border-color:var(--g);color:var(--g)}
    #status.bad{border-color:var(--r);color:#ff9999}
    .muted{color:#aaa;font-size:13px}
    .pill{display:inline-block;border:1px solid #555;border-radius:99px;padding:5px 9px;color:#aaa;font-size:12px}
    .area-card{border:1px solid #333;border-radius:10px;background:#0b0b0b;padding:12px;margin-top:12px}
    .area-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .area-head b{color:#fff}
    .area-head button{width:auto;min-width:92px;margin:0;padding:9px 10px}
    .quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
    .quick button{margin:0}
    .total{font-size:38px;font-weight:900;color:var(--o);line-height:1}
    .summary{display:grid;gap:8px}
    .summary-item{border:1px solid #333;border-radius:8px;background:#0b0b0b;padding:10px}
    .customerPicker{position:relative;margin-bottom:10px}
    .customerMatches{display:grid;gap:8px;margin-top:8px}
    .customerMatch{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid #444;border-radius:9px;background:#0b0b0b;color:#eee;padding:11px 12px}
    .customerMatch strong{display:block;color:#fff}
    .customerMatch small{display:block;color:#aaa;margin-top:3px;line-height:1.35}
    .customerMatch span{color:var(--o);font-weight:900;white-space:nowrap}
    .linkedCustomer{border:1px solid var(--g);color:var(--g);border-radius:8px;padding:9px 10px;margin-top:8px;font-size:13px}
    .customerLookupHint{color:#aaa;font-size:13px;margin-top:8px;line-height:1.35}
    .area-flash{position:fixed;left:12px;right:12px;bottom:12px;z-index:5;border:1px solid var(--o);border-radius:10px;background:#1a1007;color:#fff;padding:12px 14px;font-weight:900;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.45)}
    .hidden{display:none!important}
    @media(max-width:520px){main{padding:10px}.two,.quick{grid-template-columns:1fr}header{padding:12px}}
  </style>
</head>
<body>
  <header>
    <h1 id="title">Mobile Field Measure</h1>
    <div class="sub" id="subtitle">Measure a lead or job from your phone</div>
    <div id="status">Loading...</div>
  </header>
  <main><div id="app"></div></main>
  <script>
    const SB_URL='https://wjfewzutxvjbbnnvbylo.supabase.co', SB_KEY='sb_publishable_YWRQJz8q1lDdSz_304AUyA_YskIiTBT', supa=supabase.createClient(SB_URL,SB_KEY);
    const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
    const AREA_TYPES=['Garage','Patio','Basement','Pool Deck','Porch','Driveway','Room','Other'];
    let targetType=params.get('type')||params.get('entity')||'lead', targetId=params.get('id')||params.get('lead')||params.get('job')||'', leads=[], jobs=[], customerProfiles=[], target=null, areas=[], selectedCustomerId='';
    function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function setStatus(t,c=''){$('status').textContent=t;$('status').className=c}
    function val(id){return $(id)?.value||''}
    function num(id){return parseFloat(val(id))||0}
    function today(){return new Date().toISOString().slice(0,10)}
    function safeStorageName(name){return String(name||'file').replace(/[^a-zA-Z0-9._-]/g,'_')}
    function inferFileType(file){let name=String(file?.name||'').toLowerCase();if(file?.type)return file.type;if(name.endsWith('.pdf'))return 'application/pdf';if(/\.(jpe?g)$/i.test(name))return 'image/jpeg';if(name.endsWith('.png'))return 'image/png';if(name.endsWith('.heic'))return 'image/heic';if(name.endsWith('.webp'))return 'image/webp';return 'application/octet-stream'}
    const IMAGE_UPLOAD_MAX_SIDE=2400,IMAGE_UPLOAD_QUALITY=.78,LARGE_UPLOAD_WARN_BYTES=10*1024*1024;
    function isCompressibleImage(file){let type=String(file?.type||'').toLowerCase(),name=String(file?.name||'').toLowerCase();return (type.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(name))&&!/image\/(gif|svg\+xml)/i.test(type)}
    function compressedImageName(name){return safeStorageName(name||'photo.jpg').replace(/\.[^.]+$/,'')+'.jpg'}
    async function prepareUploadFile(file){if(!isCompressibleImage(file))return file;try{let url=URL.createObjectURL(file),img=await new Promise((resolve,reject)=>{let image=new Image();image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image could not be compressed'))};image.src=url});let width=img.naturalWidth||img.width,height=img.naturalHeight||img.height,scale=Math.min(1,IMAGE_UPLOAD_MAX_SIDE/Math.max(width,height));if(scale>=1&&file.size<900*1024)return file;let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',IMAGE_UPLOAD_QUALITY));if(!blob)return file;let compressed=new File([blob],compressedImageName(file.name),{type:'image/jpeg',lastModified:Date.now()});return compressed.size<file.size?compressed:file}catch(e){console.warn('Image compression skipped',e?.message||e);return file}}
    function confirmLargeUploads(files){let large=Array.from(files||[]).filter(file=>!isCompressibleImage(file)&&file.size>LARGE_UPLOAD_WARN_BYTES);return !large.length||confirm(`${large.length} large non-photo file${large.length===1?' is':'s are'} over 10 MB and may upload slowly. Continue?`)}
    function targetName(item){return item?.customer||item?.job_name||'Untitled'}
    function targetAddress(item){return item?.address||''}
    function targetPhone(item){return item?.phone||''}
    function customerLookupLabel(c){return [c?.name,c?.phone,c?.address].filter(Boolean).join(' - ')||'Customer'}
    function customerLookupText(c){return [c?.name,c?.phone,c?.email,c?.address,c?.notes].filter(Boolean).join(' ').toLowerCase()}
    function customerLookupRaw(includeSearch=true){return [includeSearch?val('customerSearch'):'',val('customer'),val('phone'),val('address')].filter(Boolean).join(' ').trim()}
    function currentCustomer(){return customerProfiles.find(c=>c.id===selectedCustomerId)||null}
    function customerStatusHTML(){
      const c=currentCustomer();
      return c?`<div class=linkedCustomer>Linked to existing customer: ${esc(customerLookupLabel(c))}</div>`:'<div class=customerLookupHint>Start typing to find an existing customer, or keep entering details to save this measurement with a new customer profile.</div>';
    }
    function customerLookupHTML(){
      const c=currentCustomer();
      const seed=c?customerLookupLabel(c):[targetName(target),targetPhone(target),targetAddress(target)].filter(Boolean).join(' ');
      return `<div class=customerPicker>
        <label>Customer Lookup</label>
        <input type=hidden id=customerId value="${esc(selectedCustomerId||'')}">
        <input id=customerSearch type=text autocomplete=off placeholder="Search existing customers by name, phone, email, or address" value="${esc(seed)}" oninput="customerSearchChanged()" onfocus="updateCustomerMatches()" onblur="hideCustomerMatchesSoon()">
        <div id=customerMatches class="customerMatches hidden"></div>
        <div id=customerStatus>${customerStatusHTML()}</div>
      </div>`;
    }
    function clearCustomerLink(){
      selectedCustomerId='';
      if($('customerId'))$('customerId').value='';
      if($('customerStatus'))$('customerStatus').innerHTML=customerStatusHTML();
    }
    function customerSearchChanged(){clearCustomerLink();updateCustomerMatches()}
    function customerFieldsChanged(){clearCustomerLink();updateCustomerMatches(false)}
    function hideCustomerMatches(){if($('customerMatches'))$('customerMatches').classList.add('hidden')}
    function hideCustomerMatchesSoon(){setTimeout(hideCustomerMatches,160)}
    function updateCustomerMatches(includeSearch=true){
      const box=$('customerMatches');
      if(!box)return;
      const q=customerLookupRaw(includeSearch).toLowerCase();
      const parts=q.split(/\s+/).filter(Boolean);
      if(!parts.length){box.classList.add('hidden');box.innerHTML='';return}
      const matches=customerProfiles.filter(c=>parts.every(p=>customerLookupText(c).includes(p))).slice(0,8);
      if(!matches.length){box.innerHTML='<div class=customerLookupHint>No existing customer matches yet.</div>';box.classList.remove('hidden');return}
      box.innerHTML=matches.map(c=>`<button class=customerMatch type=button onmousedown="selectCustomer('${esc(c.id)}')"><div><strong>${esc(c.name||'Unnamed customer')}</strong><small>${esc([c.phone,c.email,c.address].filter(Boolean).join(' - '))}</small></div><span>Use</span></button>`).join('');
      box.classList.remove('hidden');
    }
    function selectCustomer(id){
      const c=customerProfiles.find(x=>x.id===id);
      if(!c)return;
      selectedCustomerId=c.id;
      if($('customerId'))$('customerId').value=c.id;
      if($('customerSearch'))$('customerSearch').value=customerLookupLabel(c);
      if($('customer'))$('customer').value=c.name||'';
      if($('phone'))$('phone').value=c.phone||'';
      if($('address'))$('address').value=c.address||'';
      if($('customerStatus'))$('customerStatus').innerHTML=customerStatusHTML();
      hideCustomerMatches();
    }
    function recordOptions(){
      const list=targetType==='job'?jobs:leads;
      return list.map(item=>`<option value="${esc(item.id)}" ${item.id===targetId?'selected':''}>${esc(targetName(item))}${targetAddress(item)?' - '+esc(targetAddress(item)):''}</option>`).join('');
    }
    function selectedList(){return targetType==='job'?jobs:leads}
    function setTargetFromLists(){target=selectedList().find(item=>item.id===targetId)||null;selectedCustomerId=target?.customer_id||''}
    async function loadData(){
      setStatus('Loading records...');
      let [lr,jr,cr]=await Promise.all([
        supa.from('leads').select('id,customer_id,customer,phone,address,stage,created_at').order('created_at',{ascending:false}).limit(200),
        supa.from('jobs').select('id,customer_id,customer,phone,address,job_name,status,start_date,system_type,square_feet').order('start_date',{ascending:true,nullsFirst:false}).limit(200),
        supa.from('customers').select('id,name,phone,email,address,status,notes').order('name',{ascending:true}).limit(500)
      ]);
      if(lr.error){setStatus(lr.error.message,'bad');return}
      if(jr.error){setStatus(jr.error.message,'bad');return}
      if(cr.error)console.warn('Customer lookup unavailable',cr.error.message);
      leads=lr.data||[];
      jobs=jr.data||[];
      customerProfiles=cr.data||[];
      if(!targetId){
        const list=selectedList();
        targetId=list[0]?.id||'';
      }
      setTargetFromLists();
      render();
      setStatus(target?'Ready':'Choose a record','ok');
    }
    function totalSqft(){return areas.reduce((sum,a)=>sum+(+a.square_feet||0),0)}
    function calcArea(i){
      const area=areas[i];
      if(!area)return;
      const l=+area.length||0,w=+area.width||0;
      if(l&&w)area.square_feet=Math.round(l*w*100)/100;
    }
    function captureArea(i){
      const area=areas[i];
      if(!area)return;
      area.area_name=val(`area_name_${i}`);
      area.area_type=val(`area_type_${i}`);
      area.length=num(`length_${i}`);
      area.width=num(`width_${i}`);
      area.square_feet=num(`sqft_${i}`);
      area.floor_condition=val(`condition_${i}`);
      area.cracks_spalls_joints_notes=val(`cracks_${i}`);
      area.moisture_notes=val(`moisture_${i}`);
      area.notes=val(`notes_${i}`);
    }
    function captureAll(){areas.forEach((_,i)=>captureArea(i))}
    function updateTotal(){captureAll();$('totalSqft').textContent=totalSqft().toLocaleString(undefined,{maximumFractionDigits:2})}
    function areaCard(area,i){
      return `<div class=area-card id="area_card_${i}">
        <div class=area-head><b>Area ${i+1}</b><button class=danger type=button onclick="removeArea(${i})">Remove</button></div>
        <label>Area Name</label><input id="area_name_${i}" value="${esc(area.area_name||'')}" oninput="captureArea(${i})">
        <label>Area Type</label><select id="area_type_${i}" onchange="captureArea(${i})">${AREA_TYPES.map(t=>`<option ${area.area_type===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <div class=two>
          <div><label>Length</label><input id="length_${i}" type=number inputmode=decimal value="${esc(area.length||'')}" oninput="captureArea(${i});calcArea(${i});renderAreasOnly()"></div>
          <div><label>Width</label><input id="width_${i}" type=number inputmode=decimal value="${esc(area.width||'')}" oninput="captureArea(${i});calcArea(${i});renderAreasOnly()"></div>
        </div>
        <label>Square Footage</label><input id="sqft_${i}" type=number inputmode=decimal value="${esc(area.square_feet||'')}" oninput="captureArea(${i});updateTotal()">
        <label>Floor Condition</label><select id="condition_${i}" onchange="captureArea(${i})"><option></option>${['Good','Fair','Poor','Needs Prep','Needs Repair','Moisture Concern'].map(t=>`<option ${area.floor_condition===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
        <label>Cracks / Spalls / Joints</label><textarea id="cracks_${i}" oninput="captureArea(${i})">${esc(area.cracks_spalls_joints_notes||'')}</textarea>
        <label>Moisture Notes</label><textarea id="moisture_${i}" oninput="captureArea(${i})">${esc(area.moisture_notes||'')}</textarea>
        <label>Area Notes</label><textarea id="notes_${i}" oninput="captureArea(${i})">${esc(area.notes||'')}</textarea>
        <label>Photos / Files</label><input id="files_${i}" type=file accept="image/*,application/pdf,.pdf" multiple>
        <div class=muted>Choose photos, PDFs, or camera captures from the same picker.</div>
      </div>`;
    }
    function renderAreasOnly(){
      const active=document.activeElement?.id;
      const pos=document.activeElement?.selectionStart;
      $('areas').innerHTML=areas.map(areaCard).join('')||'<div class=muted>Add an area to start measuring.</div>';
      $('totalSqft').textContent=totalSqft().toLocaleString(undefined,{maximumFractionDigits:2});
      if(active&&$(active)){ $(active).focus(); try{ if(pos!=null)$(active).setSelectionRange(pos,pos); }catch(e){} }
    }
    function showAreaAdded(type,index){
      let toast=$('areaToast');
      if(!toast){
        toast=document.createElement('div');
        toast.id='areaToast';
        toast.className='area-flash';
        document.body.appendChild(toast);
      }
      toast.textContent=`Added ${type} area (${areas.length} total)`;
      toast.classList.remove('hidden');
      clearTimeout(window.__areaToastTimer);
      window.__areaToastTimer=setTimeout(()=>toast.classList.add('hidden'),1800);
    }
    function addArea(type='Room'){
      captureAll();
      areas.push({area_name:type,area_type:type,length:'',width:'',square_feet:'',notes:''});
      renderAreasOnly();
      setStatus(`Added ${type} area (${areas.length} total).`,'ok');
      setTimeout(()=>showAreaAdded(type,areas.length-1),50);
    }
    function removeArea(i){
      captureAll();
      areas.splice(i,1);
      renderAreasOnly();
    }
    function render(){
      if(!targetId){
        const list=selectedList();
        targetId=list[0]?.id||'';
      }
      setTargetFromLists();
      document.title='SEFS Mobile Measure';
      $('title').textContent='Mobile Field Measure';
      $('subtitle').textContent=target?`${targetType.toUpperCase()} - ${targetName(target)}`:'Choose a lead or job';
      $('app').innerHTML=`<div class=card>
        <h2>Measure For</h2>
        <label>Type</label><select id=targetType onchange="targetType=this.value;targetId='';target=null;render()"><option value=lead ${targetType==='lead'?'selected':''}>Lead</option><option value=job ${targetType==='job'?'selected':''}>Job</option></select>
        <label>Select ${targetType==='job'?'Job':'Lead'}</label><select id=targetId onchange="targetId=this.value;setTargetFromLists();render()">${recordOptions()}</select>
        ${target?`<div class=summary-item><b>${esc(targetName(target))}</b><br><span class=muted>${esc(targetPhone(target))}${targetPhone(target)&&targetAddress(target)?' - ':''}${esc(targetAddress(target))}</span><br><span class=pill>${esc(target.stage||target.status||'')}</span></div>`:'<div class=muted>No records found for this type.</div>'}
      </div>
      <div class=card>
        <h2>Measurement</h2>
        ${customerLookupHTML()}
        <label>Customer</label><input id=customer value="${esc(targetName(target))}" oninput="customerFieldsChanged()" onfocus="updateCustomerMatches(false)" onblur="hideCustomerMatchesSoon()">
        <label>Phone</label><input id=phone type=tel value="${esc(targetPhone(target))}" oninput="customerFieldsChanged()" onfocus="updateCustomerMatches(false)" onblur="hideCustomerMatchesSoon()">
        <label>Address</label><textarea id=address autocomplete="street-address" rows="3" oninput="customerFieldsChanged()" onfocus="updateCustomerMatches(false)" onblur="hideCustomerMatchesSoon()">${esc(targetAddress(target))}</textarea>
        <label>Measurement Notes</label><textarea id=measureNotes></textarea>
        <div class=quick>${AREA_TYPES.slice(0,6).map(t=>`<button class=secondary type=button onclick="addArea('${esc(t)}')">${esc(t)}</button>`).join('')}</div>
        <button class=secondary type=button onclick="addArea('Room')">Add Blank Area</button>
      </div>
      <div class=card>
        <div class=muted>Total Square Footage</div>
        <div class=total><span id=totalSqft>${totalSqft().toLocaleString(undefined,{maximumFractionDigits:2})}</span></div>
        <div class=muted>${areas.length} measured area(s)</div>
        <div id=areas>${areas.map(areaCard).join('')||'<div class=muted>Add an area to start measuring.</div>'}</div>
        <button class=primary type=button onclick="saveMeasurement()">Save Measurement</button>
        ${targetType==='job'&&targetId?`<a class=secondary href="mobile-job.html?job=${encodeURIComponent(targetId)}">Back to Job</a>`:''}
      </div>`;
    }
    async function uploadAreaPhotos(measurementId,areaId,i,area){
      const input=$(`files_${i}`);
      if(!input||!input.files.length)return;
      const files=Array.from(input.files);
      if(!confirmLargeUploads(files))throw new Error('Upload canceled.');
      for(const file of files){
        const uploadFile=await prepareUploadFile(file);
        const path=`${targetType}/${targetId}/measurements/${areaId}/${Date.now()}_${safeStorageName(uploadFile.name)}`;
        const up=await supa.storage.from('sefs-photos').upload(path,uploadFile,{upsert:false,cacheControl:'3600',contentType:inferFileType(uploadFile)});
        if(up.error)throw new Error(up.error.message);
        const pub=supa.storage.from('sefs-photos').getPublicUrl(path).data.publicUrl;
        const saved=await supa.from('photo_attachments').insert({entity_type:targetType,entity_id:targetId,file_name:uploadFile.name,storage_path:path,public_url:pub,caption:`${area.area_name||'Measured area'} - ${area.area_type||'Area'}`,category:area.area_type||'Area',field_measurement_id:measurementId,field_measurement_area_id:areaId,uploaded_by:'mobile-measure'});
        if(saved.error)throw new Error(saved.error.message);
      }
    }
    async function saveMeasurement(){
      try{
        if(!targetId||!target)throw new Error('Choose a lead or job first.');
        captureAll();
        areas=areas.filter(a=>(+a.square_feet||0)>0||a.area_name||a.notes);
        if(!areas.length)throw new Error('Add at least one measured area.');
        const total=totalSqft();
        if(total<=0)throw new Error('Enter square footage or length and width for at least one area.');
        setStatus('Saving measurement...');
        const customerProfile=await ensureCustomerProfile();
        await syncTargetCustomerProfile(customerProfile);
        const measurePayload={customer_id:customerProfile?.id||null,customer:val('customer'),phone:val('phone'),address:val('address'),notes:val('measureNotes'),total_square_feet:total,status:'Complete',source:'mobile'};
        measurePayload[targetType==='job'?'job_id':'lead_id']=targetId;
        const m=await supa.from('field_measurements').insert(measurePayload).select().single();
        if(m.error)throw new Error(m.error.message);
        for(let i=0;i<areas.length;i++){
          const a=areas[i];
          const areaPayload={field_measurement_id:m.data.id,area_name:a.area_name||a.area_type||`Area ${i+1}`,area_type:a.area_type||'',length:+a.length||0,width:+a.width||0,square_feet:+a.square_feet||0,notes:a.notes||'',floor_condition:a.floor_condition||'',cracks_spalls_joints_notes:a.cracks_spalls_joints_notes||'',moisture_notes:a.moisture_notes||'',sort_order:i};
          areaPayload[targetType==='job'?'job_id':'lead_id']=targetId;
          const ar=await supa.from('field_measurement_areas').insert(areaPayload).select().single();
          if(ar.error)throw new Error(ar.error.message);
          await uploadAreaPhotos(m.data.id,ar.data.id,i,a);
        }
        areas=[];
        render();
        setStatus(`Saved ${total.toLocaleString(undefined,{maximumFractionDigits:1})} sq ft measurement.`,'ok');
      }catch(e){
        setStatus(e.message||String(e),'bad');
      }
    }
    async function syncTargetCustomerProfile(customerProfile){
      if(!customerProfile?.id||!targetId)return;
      const payload={customer_id:customerProfile.id,customer:val('customer').trim(),phone:val('phone').trim()||null,address:val('address').trim()||null};
      const table=targetType==='job'?'jobs':'leads';
      const up=await supa.from(table).update(payload).eq('id',targetId);
      if(up.error)throw new Error(up.error.message);
      if(target)Object.assign(target,payload);
    }
    async function ensureCustomerProfile(){
      const name=val('customer').trim(),phone=val('phone').trim(),address=val('address').trim();
      if(!name)return null;
      const selected=currentCustomer();
      if(selected)return selected;
      const cleanPhone=phone.replace(/\D/g,'');
      const existing=customerProfiles.find(c=>(cleanPhone&&String(c.phone||'').replace(/\D/g,'')===cleanPhone)||(name&&address&&String(c.name||'').toLowerCase()===name.toLowerCase()&&String(c.address||'').toLowerCase()===address.toLowerCase()));
      if(existing){selectedCustomerId=existing.id;return existing}
      const payload={name,phone:phone||null,address:address||null,status:'Active',notes:'Created automatically from mobile field measure.'};
      const ins=await supa.from('customers').insert(payload).select().single();
      if(ins.error)throw new Error(ins.error.message);
      customerProfiles.push(ins.data);
      selectedCustomerId=ins.data.id;
      return ins.data;
    }
    loadData();
  </script>
