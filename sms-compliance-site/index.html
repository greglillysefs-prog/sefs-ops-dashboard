<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Southeast Flooring Solutions SMS Compliance</title>
  <link rel="icon" type="image/jpeg" href="assets/sefs-icon.jpeg">
  <style>
    :root{--o:#ff7900;--bg:#050505;--l:#3b3b3b;--m:#aaa}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top left,#24170d,#050505 42%);color:#eee;font-family:Arial,Helvetica,sans-serif;line-height:1.55}
    header{display:flex;gap:18px;align-items:center;padding:22px clamp(18px,5vw,64px);background:#000d;border-bottom:1px solid #333}
    img{width:96px;height:auto}
    main{max-width:920px;margin:0 auto;padding:40px clamp(18px,5vw,44px) 64px}
    h1{margin:0;font-size:clamp(30px,5vw,48px)}
    .sub{color:var(--m);margin-top:6px}
    .card{background:linear-gradient(145deg,#1c1c1c,#101010);border:1px solid var(--l);border-radius:12px;padding:22px;margin-top:18px}
    .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
    a{display:block;border:1px solid var(--o);border-radius:10px;color:var(--o);padding:15px;text-decoration:none;font-weight:900}
    a:hover{background:#1b1209}
  </style>
</head>
<body>
  <header>
    <img src="assets/sefs-icon.jpeg" alt="Southeast Flooring Solutions logo">
    <div>
      <h1>SMS Compliance</h1>
      <div class="sub">Southeast Flooring Solutions</div>
    </div>
  </header>
  <main>
    <div class="card">
      <p>This site hosts public SMS compliance documents for Southeast Flooring Solutions text messaging.</p>
      <div class="links">
        <a href="privacy.html">SMS Privacy Policy</a>
        <a href="terms.html">SMS Terms and Conditions</a>
      </div>
    </div>
  </main>
</body>
</html>
