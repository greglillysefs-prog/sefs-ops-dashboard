<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEFS Quote Print</title>
<link rel="manifest" href="manifest.webmanifest?v=20260817b">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SEFS Quote">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/jpeg" href="assets/sefs-icon.jpeg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/sefs-app-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/sefs-app-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/sefs-app-icon-180.png">
<script defer src="pwa-init.js?v=20260817b"></script>
<style>
body{margin:0;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif}
.print-toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;background:#050505;border-bottom:1px solid #333}
.print-toolbar strong{font-size:16px}
.print-toolbar div{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #555;border-radius:8px;background:#1a1a1a;color:#fff;font-weight:900;padding:10px 14px;cursor:pointer;text-transform:uppercase}
button.primary{background:linear-gradient(180deg,#ff8a18,#f05d00);border-color:#ff7900}
#missing{max-width:760px;margin:40px auto;padding:20px;border:1px solid #444;border-radius:8px;background:#181818}
#printFrame{width:100%;height:calc(100vh - 58px);border:0;background:#fff}
@media print{
  .print-toolbar,#missing{display:none!important}
  #printFrame{height:100vh}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="print-toolbar">
  <strong>SEFS Quote Print</strong>
  <div>
    <button class="primary" onclick="printQuote()">Print / Save PDF</button>
    <button onclick="window.close()">Close</button>
  </div>
</div>
<div id="missing" hidden>
  <h2>No quote ready to print</h2>
  <p>Go back to the Quote Builder, generate the quote, then use Print / Save PDF again.</p>
</div>
<iframe id="printFrame" title="Quote print preview"></iframe>
<script>
const html=localStorage.getItem("sefs_quote_print_html")||"";
const frame=document.getElementById("printFrame");
const missing=document.getElementById("missing");
if(!html){
  frame.hidden=true;
  missing.hidden=false;
}else{
  const doc=frame.contentDocument;
  doc.open();
  doc.write(html);
  doc.close();
  setTimeout(printQuote,500);
}
function printQuote(){
  if(!html)return;
  frame.contentWindow.focus();
  frame.contentWindow.print();
}
</script>
</body>
</html>
