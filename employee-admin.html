<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEFS Employee Admin</title>
  <link rel="icon" href="assets/sefs-icon.jpeg">
  <style>
    :root {
      --bg: #050505;
      --panel: #111;
      --line: #333;
      --text: #f4f4f4;
      --muted: #aaa;
      --orange: #ff7a00;
      --good: #18c77a;
      --bad: #ff6262;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(255,122,0,.14), transparent 32rem), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--orange);
      background: linear-gradient(180deg, #242424, #141414);
      color: var(--text);
      border-radius: 8px;
      min-height: 42px;
      padding: 9px 13px;
      font-weight: 900;
    }

    button.primary {
      background: var(--orange);
      color: #111;
    }

    button.danger {
      border-color: var(--bad);
      color: #ffd2d2;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      background: #101010;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
    }

    select option {
      background: #050505;
      color: #fff;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #ddd;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #292929;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 34px);
      line-height: 1;
    }

    p {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: 20px;
    }

    .card h2:before {
      content: "";
      width: 28px;
      height: 3px;
      background: var(--orange);
      border-radius: 999px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .notice {
      border: 1px solid rgba(255,122,0,.45);
      background: rgba(255,122,0,.08);
      color: #ffd7b0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      word-break: break-word;
    }

    .notice.error {
      border-color: rgba(255,98,98,.6);
      background: rgba(255,98,98,.08);
      color: #ffc7c7;
    }

    .notice.good {
      border-color: rgba(24,199,122,.55);
      background: rgba(24,199,122,.08);
      color: #c9ffe5;
    }

    .muted {
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    .people {
      display: grid;
      gap: 10px;
    }

    .person {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      border-radius: 8px;
      padding: 14px;
    }

    .person h3 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 28px;
      padding: 3px 9px;
      font-weight: 800;
      font-size: 12px;
      color: var(--muted);
    }

    .pill.ok {
      border-color: rgba(24,199,122,.55);
      color: var(--good);
    }

    .pill.bad {
      border-color: rgba(255,98,98,.55);
      color: var(--bad);
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .quick-links a {
      color: var(--orange);
      font-weight: 900;
      text-decoration: none;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }
    }

    @media (max-width: 560px) {
      .shell {
        padding: 12px;
      }

      .person {
        grid-template-columns: 1fr;
      }

      .person button {
        width: 100%;
      }

      .actions button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/sefs-icon.jpeg" alt="SEFS">
        <div>
          <h1>Employee Admin</h1>
          <p>Add or remove employee portal access without touching SQL.</p>
        </div>
      </div>
      <div class="quick-links">
        <a href="index.html">Dashboard</a>
        <a href="employee-portal.html">Employee Portal</a>
      </div>
    </header>

    <div id="message" class="notice hidden"></div>

    <div class="grid">
      <section class="card">
        <h2>Add Employee Access</h2>
        <form id="employeeForm" class="form-grid">
          <div>
            <label>Admin PIN</label>
            <input id="adminPin" type="password" autocomplete="off" required>
          </div>
          <div>
            <label>Employee Name</label>
            <input id="fullName" autocomplete="name" required>
          </div>
          <div>
            <label>Email</label>
            <input id="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label>Role</label>
            <select id="role">
              <option value="employee">Employee</option>
              <option value="crew_lead">Crew Lead</option>
              <option value="manager">Manager</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div>
            <label>Password</label>
            <input id="password" type="text" autocomplete="new-password" placeholder="Leave blank to generate one">
          </div>
          <div class="actions">
            <button class="primary" type="submit">Save Access</button>
            <button id="refreshBtn" type="button">Refresh List</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>People With Portal Access</h2>
        <div id="people" class="people">
          <div class="muted">Enter the admin PIN and refresh the list.</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const SB_URL = 'https://wjfewzutxvjbbnnvbylo.supabase.co';
    const FUNCTION_URL = `${SB_URL}/functions/v1/employee-admin`;
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    let rows = [];

    function setMessage(text, type = '') {
      const message = $('message');
      message.textContent = text || '';
      message.className = `notice ${type} ${text ? '' : 'hidden'}`;
    }

    async function callAdmin(action, extra = {}) {
      const pin = $('adminPin').value.trim();
      if (!pin) throw new Error('Enter the employee admin PIN first.');

      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-sefs-admin-pin': pin
        },
        body: JSON.stringify({ action, ...extra })
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.error) {
        throw new Error(payload.error || `Request failed with ${response.status}`);
      }
      return payload;
    }

    async function refreshPeople() {
      setMessage('Loading employees...');
      const result = await callAdmin('list');
      rows = result.rows || [];
      renderPeople();
      setMessage('');
    }

    function renderPeople() {
      const people = rows.filter((row) => row.profile || row.auth_user);
      if (!people.length) {
        $('people').innerHTML = '<div class="muted">No employee portal users yet.</div>';
        return;
      }

      $('people').innerHTML = people.map((row) => {
        const employee = row.employee || {};
        const profile = row.profile || {};
        const user = row.auth_user || {};
        const active = Boolean(employee.active && profile.active);
        return `
          <article class="person">
            <div>
              <h3>${esc(profile.full_name || employee.name || user.email || 'Employee')}</h3>
              <div class="facts">
                <span>${esc(user.email || 'No login email')}</span>
                <span class="pill">${esc(profile.role || 'No role')}</span>
                <span class="pill ${active ? 'ok' : 'bad'}">${active ? 'Active' : 'Inactive'}</span>
                ${user.last_sign_in_at ? `<span>Last sign in: ${esc(new Date(user.last_sign_in_at).toLocaleDateString())}</span>` : ''}
              </div>
            </div>
            <button class="danger" type="button" onclick="deactivatePerson('${esc(employee.id)}','${esc(profile.id)}')">Remove Access</button>
          </article>
        `;
      }).join('');
    }

    window.deactivatePerson = async function deactivatePerson(employeeId, userId) {
      if (!confirm('Remove this person from the employee portal?')) return;
      try {
        await callAdmin('deactivate', { employee_id: employeeId, user_id: userId });
        setMessage('Employee portal access removed.', 'good');
        await refreshPeople();
      } catch (error) {
        setMessage(error.message, 'error');
      }
    };

    $('employeeForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const payload = {
          full_name: $('fullName').value.trim(),
          email: $('email').value.trim(),
          role: $('role').value,
          password: $('password').value.trim()
        };
        const result = await callAdmin('upsert', payload);
        $('fullName').value = '';
        $('email').value = '';
        $('password').value = '';
        $('role').value = 'employee';
        const temp = result.temporary_password ? ` Temporary password: ${result.temporary_password}` : '';
        setMessage(`Employee portal access saved.${temp}`, 'good');
        await refreshPeople();
      } catch (error) {
        setMessage(error.message, 'error');
      }
    });

    $('refreshBtn').addEventListener('click', async () => {
      try {
        await refreshPeople();
      } catch (error) {
        setMessage(error.message, 'error');
      }
    });
  </script>
</body>
</html>
