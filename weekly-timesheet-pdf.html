<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Timesheet PDF</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260811b">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SEFS Timesheet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/jpeg" href="assets/sefs-icon.jpeg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/sefs-app-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/sefs-app-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/sefs-app-icon-180.png">
  <script defer src="pwa-init.js?v=20260811b"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f3f3;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: #111;
      color: #fff;
    }
    .toolbar strong { display: block; }
    .toolbar span { color: #cfcfcf; font-size: 13px; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button, a {
      border: 1px solid #ff7a00;
      border-radius: 8px;
      background: #ff7a00;
      color: #111;
      min-height: 40px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    a {
      display: inline-flex;
      align-items: center;
      background: #222;
      color: #fff;
    }
    .secondary {
      background: #222;
      color: #fff;
    }
    .hint {
      color: #555;
      font-size: 12px;
      margin: 10px 0 0;
      text-align: center;
    }
    main {
      padding: 18px;
    }
    .paper {
      max-width: 13.5in;
      margin: 0 auto;
      padding: 18px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(0,0,0,.16);
    }
    h3 {
      margin: 0 0 4px;
      font-size: 20px;
      text-transform: uppercase;
    }
    .muted { color: #444; }
    .weekly-tools {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .status {
      border: 1px solid #111;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .timesheet-wrap {
      display: block !important;
      width: 100%;
      overflow: visible;
    }
    .mobile-timesheet {
      display: none !important;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 8.5px;
    }
    th, td {
      border: 1px solid #999;
      padding: 5px 4px;
      text-align: center;
      vertical-align: middle;
      color: #111;
    }
    th {
      background: #eee;
      text-transform: uppercase;
      font-weight: 800;
    }
    .employee-col {
      width: 110px;
      text-align: left;
      font-weight: 800;
      background: #f7f7f7;
    }
    .total-col, .pay-col, .overtime-col {
      font-weight: 800;
    }
    tfoot td {
      font-weight: 800;
      background: #f3f3f3;
    }
    .timesheet-notes-row td {
      vertical-align: top;
      font-weight: 400;
    }
    .timesheet-note {
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.25;
    }
    .empty {
      max-width: 680px;
      margin: 60px auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    @page {
      size: landscape;
      margin: .35in;
    }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      main { padding: 0; }
      .paper {
        max-width: none;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <strong id="docTitle">Weekly Timesheet</strong>
      <span id="docPeriod"></span>
    </div>
    <div class="actions">
      <a href="employee-portal.html">Back to Portal</a>
      <button type="button" class="secondary" onclick="shareTimesheet()">Share</button>
      <button type="button" onclick="printTimesheet()">Print / Save PDF</button>
    </div>
  </div>
  <main>
    <div id="paper" class="paper"></div>
    <p id="shareHint" class="hint"></p>
  </main>
  <script>
    const paper = document.getElementById('paper');
    let printData = {};
    function printTimesheet() {
      const hint = document.getElementById('shareHint');
      if (hint) hint.textContent = 'Opening print dialog...';
      setTimeout(() => {
        try {
          window.focus();
          window.print();
          if (hint) hint.textContent = 'If the print dialog did not open, use your browser share button and choose Print.';
        } catch (error) {
          if (hint) hint.textContent = 'Print is blocked in this browser. Use Share, then choose Print or Save to Files.';
        }
      }, 80);
    }
    async function shareTimesheet() {
      const hint = document.getElementById('shareHint');
      const title = document.getElementById('docTitle')?.textContent || 'Weekly Timesheet';
      const period = document.getElementById('docPeriod')?.textContent || '';
      const text = `${title}${period ? ' - ' + period : ''}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: text, text, url: location.href });
          if (hint) hint.textContent = 'Shared.';
          return;
        }
      } catch (error) {
        if (error?.name === 'AbortError') return;
      }
      try {
        await navigator.clipboard.writeText(location.href);
        if (hint) hint.textContent = 'Share is not available here, so the page link was copied. You can also use Print / Save PDF.';
      } catch (error) {
        if (hint) hint.textContent = 'Share is not available in this browser. Use Print / Save PDF or your browser share button.';
      }
    }
    try {
      printData = JSON.parse(sessionStorage.getItem('sefs_weekly_timesheet_print') || '{}');
      if (!printData.html) throw new Error('No weekly timesheet was sent to this page.');
      document.title = `${printData.title || 'Weekly Timesheet'} ${printData.period || ''}`.trim();
      document.getElementById('docTitle').textContent = printData.title || 'Weekly Timesheet';
      document.getElementById('docPeriod').textContent = printData.period || '';
      paper.innerHTML = printData.html;
      paper.querySelectorAll('.mobile-timesheet, .no-print, details').forEach((node) => node.remove());
      paper.querySelectorAll('.timesheet-wrap').forEach((node) => { node.style.display = 'block'; });
    } catch (error) {
      paper.className = 'empty';
      paper.innerHTML = `<h2>Weekly Timesheet Not Found</h2><p>${String(error.message || error)}</p><p>Go back to the Employee Portal and press Share / Save PDF again.</p>`;
    }
  </script>
</body>
</html>
