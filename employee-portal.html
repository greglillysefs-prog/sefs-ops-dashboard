<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEFS Employee Portal</title>
  <link rel="manifest" href="employee-portal.webmanifest?v=20260811g">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SEFS Portal">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="assets/sefs-icon.jpeg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/sefs-app-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/sefs-app-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/sefs-app-icon-180.png">
  <script defer src="pwa-init.js?v=20260811g"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050505;
      --panel: #111;
      --panel2: #181818;
      --line: #333;
      --text: #f4f4f4;
      --muted: #a8a8a8;
      --orange: #ff7a00;
      --orange2: #ff9b33;
      --good: #15c77a;
      --bad: #ff6262;
      --warn: #ffd166;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(255, 122, 0, .12), transparent 30rem), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--orange);
      background: linear-gradient(180deg, #222, #141414);
      color: var(--text);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 800;
      letter-spacing: 0;
    }

    button.primary {
      background: var(--orange);
      color: #111;
      border-color: var(--orange);
    }

    button.ghost {
      border-color: var(--line);
      color: var(--muted);
    }

    a.ghost {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #222, #141414);
      color: var(--muted);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 800;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
    }

    button:disabled {
      opacity: .55;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #101010;
      color: var(--text);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 12px;
    }

    select option {
      background: #050505;
      color: #fff;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    label {
      display: block;
      color: #d8d8d8;
      font-size: 12px;
      font-weight: 900;
      margin: 0 0 6px;
      text-transform: uppercase;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #292929;
    }

    .brand h1 {
      font-size: clamp(22px, 5vw, 34px);
      line-height: 1;
      margin: 0;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 16px;
      align-items: start;
    }

    .grid > * {
      min-width: 0;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      min-width: 0;
    }

    .card + .card {
      margin-top: 16px;
    }

    .crew-view .shell,
    .manager-view .shell {
      width: min(1500px, 100%);
    }

    .crew-view .grid {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
    }

    .manager-view .grid {
      grid-template-columns: minmax(380px, .9fr) minmax(560px, 1.1fr);
    }

    .crew-view #timePanel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .crew-view #timePanel .card {
      margin-top: 0;
    }

    .pay-periods-wide {
      margin-top: 16px;
      width: 100%;
    }

    .manager-top-stack {
      display: grid;
      gap: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: 20px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .card-head h2 {
      margin: 0;
    }

    .card-head a {
      text-decoration: none;
    }

    .card h2:before {
      content: "";
      width: 28px;
      height: 3px;
      background: var(--orange);
      border-radius: 999px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .full { grid-column: 1 / -1; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .password-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .password-control button {
      min-width: 90px;
    }

    .crew-selected {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .crew-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 122, 0, .5);
      background: rgba(255, 122, 0, .1);
      border-radius: 999px;
      padding: 6px 8px 6px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .crew-chip button {
      border-color: rgba(255,255,255,.2);
      border-radius: 999px;
      min-height: 28px;
      min-width: 28px;
      padding: 0;
      line-height: 1;
    }

    .crew-check-list {
      display: grid;
      gap: 8px;
    }

    .crew-check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }

    .crew-check input {
      width: 20px;
      min-height: 20px;
      accent-color: var(--orange);
    }

    .crew-check b {
      display: block;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
    }

    .status.draft { color: var(--muted); }
    .status.submitted { color: var(--warn); border-color: rgba(255,209,102,.55); }
    .status.approved { color: var(--good); border-color: rgba(21,199,122,.55); }
    .status.rejected { color: var(--bad); border-color: rgba(255,98,98,.55); }

    .muted {
      color: var(--muted);
    }

    .notice {
      border: 1px solid rgba(255, 122, 0, .45);
      background: rgba(255, 122, 0, .08);
      color: #ffd7b0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .error {
      border-color: rgba(255, 98, 98, .6);
      background: rgba(255, 98, 98, .08);
      color: #ffc4c4;
    }

    .job-list, .entry-list {
      display: grid;
      gap: 10px;
    }

    .job-card, .entry-card {
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }

    .job-card header, .entry-card header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .job-card h3, .entry-card h3 {
      margin: 0;
      font-size: 16px;
    }

    .schedule-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .schedule-card-head h2 {
      margin: 0;
    }

    .schedule-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .schedule-nav button {
      min-height: 38px;
      padding: 8px 12px;
    }

    .schedule-month {
      color: #fff;
      font-weight: 900;
      min-width: 150px;
      text-align: center;
    }

    .portal-calendar {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0,0,0,.24);
    }

    .portal-calendar-month {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255,122,0,.18), rgba(255,255,255,.04));
      color: #fff;
      font-weight: 900;
    }

    .portal-calendar-month span {
      color: var(--orange);
      font-size: 18px;
    }

    .portal-calendar-month small {
      color: var(--muted);
      font-weight: 800;
    }

    .portal-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: auto repeat(6, minmax(112px, auto));
      touch-action: pan-y;
      will-change: transform, opacity;
      position: relative;
    }

    .portal-calendar-head {
      background: rgba(255,122,0,.16);
      border-right: 1px solid var(--line);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 6px;
      text-align: center;
      text-transform: uppercase;
    }

    .portal-calendar-head:nth-child(7) {
      border-right: 0;
    }

    .portal-calendar-day {
      min-height: 112px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.018);
      z-index: 1;
    }

    .portal-calendar-day:nth-child(7n) {
      border-right: 0;
    }

    .portal-calendar-day.other-month {
      opacity: .42;
    }

    .portal-calendar-day.today {
      box-shadow: inset 0 0 0 2px rgba(255,122,0,.65);
    }

    .portal-calendar-date {
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .portal-calendar-event {
      display: block;
      width: auto;
      min-height: 0;
      margin: 5px 0 0;
      padding: 7px;
      border-color: rgba(255,122,0,.5);
      background: linear-gradient(180deg, rgba(255,122,0,.2), rgba(255,122,0,.07));
      color: #fff;
      border-radius: 6px;
      text-align: left;
      font-size: 12px;
      line-height: 1.25;
      text-transform: none;
    }

    .portal-calendar-bar {
      align-self: start;
      position: relative;
      z-index: 4;
      margin: 0 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 8px 14px rgba(0,0,0,.35);
    }

    .portal-calendar-event.active {
      outline: 2px solid var(--orange);
      outline-offset: 1px;
      color: #fff;
    }

    .portal-calendar-event.task-event {
      border-color: rgba(43,182,115,.7);
      background: linear-gradient(180deg, rgba(43,182,115,.2), rgba(43,182,115,.07));
    }

    .portal-calendar-event small {
      display: block;
      margin-top: 3px;
      color: inherit;
      opacity: .78;
      font-weight: 700;
    }

    .portal-schedule-detail {
      margin-top: 12px;
    }

    .schedule-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .address-link {
      color: var(--orange);
      font-weight: 900;
      text-decoration: none;
    }

    .address-link:hover,
    .address-link:focus {
      text-decoration: underline;
    }

    .schedule-map {
      width: 100%;
      height: 180px;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #050505;
    }

    .schedule-map iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      filter: grayscale(.15) contrast(1.05);
    }

    .mini-material-list {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 14px 0;
      overflow: hidden;
      background: rgba(255, 255, 255, .02);
    }

    .mini-material-list h4 {
      margin: 0;
      padding: 10px 12px;
      background: rgba(255, 121, 0, .12);
      font-size: 13px;
      text-transform: uppercase;
    }

    .mini-material-list div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-top: 1px solid var(--line);
    }

    .mini-material-list b {
      white-space: nowrap;
      color: var(--orange);
    }

    .linked-photo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .linked-photo-grid a,
    .linked-photo-grid img {
      display: block;
      width: 100%;
    }

    .linked-photo-grid img {
      aspect-ratio: 1.25;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050505;
    }

    .linked-attachment-file {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 68px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #050505;
      color: var(--text);
      text-decoration: none;
    }

    .linked-attachment-file b {
      color: var(--orange);
      font-size: 13px;
    }

    .linked-attachment-file span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-link {
      border: 1px solid var(--orange);
      background: linear-gradient(180deg, #222, #141414);
      color: var(--text);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .schedule-update-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .fact b {
      display: block;
      color: #eee;
      font-size: 12px;
      text-transform: uppercase;
    }

    .timesheet-wrap {
      max-width: 100%;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
    }

    .timesheet {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    .timesheet th,
    .timesheet td {
      border: 1px solid rgba(255,255,255,.12);
      padding: 9px 8px;
      text-align: center;
      vertical-align: middle;
    }

    .manager-view .timesheet th,
    .manager-view .timesheet td {
      padding: 8px 5px;
      font-size: 11px;
    }

    .timesheet thead th {
      background: rgba(255,122,0,.18);
      color: #fff;
      font-size: 12px;
      text-transform: uppercase;
    }

    .timesheet .employee-col {
      position: sticky;
      left: 0;
      z-index: 1;
      width: 140px;
      text-align: left;
      background: #111;
      color: #fff;
      font-weight: 900;
    }

    .timesheet tbody tr:nth-child(even) td {
      background: rgba(255,255,255,.025);
    }

    .timesheet tbody tr:nth-child(even) .employee-col {
      background: #111;
    }

    .timesheet .total-col {
      background: rgba(255,122,0,.12);
      color: var(--orange2);
      font-weight: 900;
    }

    .timesheet .overtime-col {
      background: rgba(255,98,98,.1);
      color: #ffb8b8;
      font-weight: 900;
    }

    .timesheet .pay-col {
      background: rgba(21,199,122,.08);
      color: #d8ffee;
      font-weight: 900;
    }

    .pay-rate-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .pay-rate-table th,
    .pay-rate-table td {
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding: 8px 0;
      text-align: left;
    }

    .pay-rate-table th:last-child,
    .pay-rate-table td:last-child {
      text-align: right;
      width: 140px;
    }

    .pay-rate-table input {
      min-height: 36px;
      padding: 7px 9px;
      text-align: right;
    }

    .timesheet-foot {
      background: rgba(255,122,0,.16);
      font-weight: 900;
    }

    .timesheet-notes-row td {
      vertical-align: top;
    }

    .timesheet-note {
      margin-top: 5px;
      border-top: 1px solid rgba(255,255,255,.12);
      padding-top: 5px;
      color: #e6e6e6;
      font-size: 10px;
      line-height: 1.3;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .timesheet-note + .timesheet-note {
      margin-top: 6px;
    }

    .mobile-timesheet {
      display: none;
    }

    .mobile-week-day {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,.24);
      padding: 10px;
    }

    .mobile-week-day + .mobile-week-day {
      margin-top: 10px;
    }

    .mobile-week-day header,
    .mobile-week-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
    }

    .mobile-week-day header {
      margin: 0 0 8px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding-bottom: 8px;
    }

    .mobile-week-row {
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .mobile-week-row:last-child {
      border-bottom: 0;
    }

    .mobile-week-notes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .weekly-tools {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .weekly-tools header {
      margin: 0;
    }

    .weekly-tools button {
      min-height: 38px;
      padding: 8px 12px;
    }

    .hours {
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      color: var(--orange2);
    }

    .totals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .total {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(0,0,0,.25);
    }

    .total b {
      display: block;
      font-size: 24px;
      color: var(--orange2);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .mobile-tab-select-wrap {
      display: block;
      margin-bottom: 12px;
    }

    .mobile-tab-select-wrap select {
      border-color: var(--orange);
      font-weight: 900;
      min-height: 46px;
    }

    .hidden,
    .hidden-mobile { display: none !important; }

    @media (max-width: 1200px) {
      .manager-view .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 980px) {
      .crew-view .grid {
        grid-template-columns: 1fr;
      }

      .crew-view #timePanel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        display: none;
      }

      .mobile-tab-select-wrap {
        display: block;
      }

      .pay-periods-wide {
        margin-top: 12px;
      }
    }

    @media (max-width: 620px) {
      .shell {
        padding: 10px;
        width: 100%;
      }

      .topbar {
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .form-grid, .facts, .totals {

    function withTimeout(promise, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(message)), 15000))
      ]);
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(`${value}T00:00:00`);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function dateOnly(value) {
      return new Date(`${value}T00:00:00`);
    }

    function isoDate(date) {
      return date.toISOString().slice(0, 10);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function payPeriodStart(value = today()) {
      const date = dateOnly(value);
      const offset = (date.getDay() - 3 + 7) % 7;
      return addDays(date, -offset);
    }

    function formatTime(value) {
      if (!value) return '';
      const [hours, minutes] = value.split(':');
      const date = new Date();
      date.setHours(Number(hours || 0), Number(minutes || 0), 0, 0);
      return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    function normalizeQuarterTime(value) {
      if (!value) return '';
      const [hours, minutes] = String(value).split(':').map(Number);
      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return '';
      let total = hours * 60 + minutes;
      total = Math.round(total / 15) * 15;
      if (total >= 24 * 60) total = 0;
      const hh = String(Math.floor(total / 60)).padStart(2, '0');
      const mm = String(total % 60).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function snapTimeInput(id) {
      const input = $(id);
      input.value = normalizeQuarterTime(input.value);
      calculateHours();
    }

    function formatRange(job) {
      const start = formatDate(job.start_date);
      const end = job.end_date && job.end_date !== job.start_date ? ` - ${formatDate(job.end_date)}` : '';
      const times = [formatTime(job.start_time), formatTime(job.end_time)].filter(Boolean).join(' - ');
      return `${start}${end}${times ? `, ${times}` : ''}`;
    }

    function scheduleIsoDate(date) {
      const copy = new Date(date);
      copy.setMinutes(copy.getMinutes() - copy.getTimezoneOffset());
      return copy.toISOString().slice(0, 10);
    }

    function scheduleDate(value) {
      if (!value) return null;
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function scheduleMonthName(date) {
      return date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    }

    function jobAppearsOnDate(job, iso) {
      const target = scheduleDate(iso);
      const start = scheduleDate(job.start_date);
      const end = scheduleDate(job.end_date || job.start_date);
      if (!target || !start) return false;
      return target >= start && target <= (end || start);

    function colorHashIndex(value) {
      let hash = 0;
      const text = String(value || '');
      for (let i = 0; i < text.length; i += 1) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return Math.abs(hash);
    }

    function hexToRgba(hex, alpha) {
      let value = String(hex || '').replace('#', '');
      if (value.length === 3) value = value.split('').map((ch) => ch + ch).join('');
      const number = parseInt(value, 16);
      if (Number.isNaN(number)) return `rgba(255,122,0,${alpha})`;
      return `rgba(${(number >> 16) & 255},${(number >> 8) & 255},${number & 255},${alpha})`;
    }

      if (photo?.public_url) return photo.public_url;

    function safeStorageName(name) {
      return String(name || 'file').replace(/[^a-zA-Z0-9._-]/g, '_');

    function inferFileType(file) {
      const name = String(file?.name || '').toLowerCase();
      if (file?.type) return file.type;
      if (name.endsWith('.pdf')) return 'application/pdf';
      if (/\.(jpe?g)$/i.test(name)) return 'image/jpeg';
      if (name.endsWith('.png')) return 'image/png';
      if (name.endsWith('.heic')) return 'image/heic';
      if (name.endsWith('.webp')) return 'image/webp';
      return 'application/octet-stream';
    }

    const IMAGE_UPLOAD_MAX_SIDE = 2400;
    const IMAGE_UPLOAD_QUALITY = 0.78;
    const LARGE_UPLOAD_WARN_BYTES = 10 * 1024 * 1024;

    function isCompressibleImage(file) {
      const type = String(file?.type || '').toLowerCase();
      const name = String(file?.name || '').toLowerCase();
      return (type.startsWith('image/') || /\.(jpe?g|png|webp|heic)$/i.test(name)) && !/image\/(gif|svg\+xml)/i.test(type);
    }

    function compressedImageName(name) {
      return safeStorageName(name || 'photo.jpg').replace(/\.[^.]+$/, '') + '.jpg';
    }

    async function prepareUploadFile(file) {
      if (!isCompressibleImage(file)) return file;
      try {
        const url = URL.createObjectURL(file);
        const img = await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Image could not be compressed'));
          };
          image.src = url;
        });
        const width = img.naturalWidth || img.width;
        const height = img.naturalHeight || img.height;
        const scale = Math.min(1, IMAGE_UPLOAD_MAX_SIDE / Math.max(width, height));
        if (scale >= 1 && file.size < 900 * 1024) return file;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', IMAGE_UPLOAD_QUALITY));
        if (!blob) return file;
        const compressed = new File([blob], compressedImageName(file.name), { type: 'image/jpeg', lastModified: Date.now() });
        return compressed.size < file.size ? compressed : file;
      } catch (error) {
        console.warn('Image compression skipped', error?.message || error);
        return file;
      }
    }

    function confirmLargeUploads(files) {
      const large = Array.from(files || []).filter((file) => !isCompressibleImage(file) && file.size > LARGE_UPLOAD_WARN_BYTES);
      return !large.length || confirm(`${large.length} large non-photo file${large.length === 1 ? ' is' : 's are'} over 10 MB and may upload slowly. Continue?`);
    }

    function calculateHours() {
      const start = $('startTime').value;
      const end = $('endTime').value;
      if (!start || !end) {
        $('calculatedHours').textContent = '0.00';
        return 0;
      }

      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let minutes = (eh * 60 + em) - (sh * 60 + sm);
      if (minutes < 0) minutes += 24 * 60;
      const hours = Math.round((minutes / 60) * 100) / 100;
      $('calculatedHours').textContent = hours.toFixed(2);
      return hours;
    }

    async function changeOwnPassword(event) {
      event.preventDefault();
      const email = session?.user?.email;
      const currentPassword = $('currentPassword').value;
      const newPassword = $('newPassword').value;
      const confirmPassword = $('confirmNewPassword').value;
      if (!email) return setMessage('passwordMessage', 'This login does not have an email on file.', true);
      if (!currentPassword) return setMessage('passwordMessage', 'Enter your current password.', true);
      if (newPassword.length < 6) return setMessage('passwordMessage', 'New password must be at least 6 characters.', true);
      if (newPassword !== confirmPassword) return setMessage('passwordMessage', 'New passwords do not match.', true);
      setPasswordBusy(true);
      setMessage('passwordMessage', 'Checking current password...');
      try {
        const verified = await withTimeout(
          supa.auth.signInWithPassword({ email, password: currentPassword }),
          'Password check timed out. Try again.'
        );
        if (verified.error) throw new Error('Current password is not correct.');
        const updated = await withTimeout(
          supa.auth.updateUser({ password: newPassword }),
          'Password update timed out. Try again.'
        );
        if (updated.error) throw updated.error;
        clearPasswordForm();
        setMessage('passwordMessage', 'Password changed.');
      } catch (error) {
        setMessage('passwordMessage', error.message || String(error), true);
      } finally {
        setPasswordBusy(false);
      }
    }

    async function loadScheduleJobPhotos() {
      scheduleJobPhotos = [];
      if (!scheduleJobs.length) return;

      const byJob = new Map(scheduleJobs.map((job) => {
        const pairs = new Set([`job:${job.id}`]);
        if (job.customer_id) pairs.add(`customer:${job.customer_id}`);
        if (job.source_lead_id) pairs.add(`lead:${job.source_lead_id}`);
        if (job.source_quote_id) pairs.add(`quote:${job.source_quote_id}`);
        return [job.id, { job, pairs, measurementIds: new Set() }];
      }));
      const jobIds = [...byJob.keys()];
      const leadIds = [...new Set(scheduleJobs.map((job) => job.source_lead_id).filter(Boolean))];
      const sourceQuoteIds = [...new Set(scheduleJobs.map((job) => job.source_quote_id).filter(Boolean))];
      const measureRows = [];
      const quoteRows = [];

      if (jobIds.length) {
        const result = await supa.from('quotes').select('id, lead_id, job_id, customer_id, quote_json').in('job_id', jobIds);
        if (!result.error) quoteRows.push(...(result.data || []));
      }
      if (sourceQuoteIds.length) {
        const result = await supa.from('quotes').select('id, lead_id, job_id, customer_id, quote_json').in('id', sourceQuoteIds);
        if (!result.error) quoteRows.push(...(result.data || []));
      }

      const seenQuoteIds = new Set();
      quoteRows.forEach((quote) => {
        if (!quote?.id || seenQuoteIds.has(quote.id)) return;
        seenQuoteIds.add(quote.id);
        byJob.forEach((info) => {
          if (quote.job_id !== info.job.id && quote.id !== info.job.source_quote_id) return;
          info.pairs.add(`quote:${quote.id}`);
          if (quote.lead_id) info.pairs.add(`lead:${quote.lead_id}`);
          if (quote.customer_id) info.pairs.add(`customer:${quote.customer_id}`);
          quoteMeasurementIds(quote).forEach((id) => info.measurementIds.add(id));
        });
      });

      if (jobIds.length) {
        const result = await supa.from('field_measurements').select('id, job_id, lead_id').in('job_id', jobIds);
        if (!result.error) measureRows.push(...(result.data || []));
      }
      if (leadIds.length) {
        const result = await supa.from('field_measurements').select('id, job_id, lead_id').in('lead_id', leadIds);
        if (!result.error) measureRows.push(...(result.data || []));
      }

      const seenMeasureIds = new Set();
      measureRows.forEach((measure) => {
        if (!measure?.id || seenMeasureIds.has(measure.id)) return;
        seenMeasureIds.add(measure.id);
        if (measure.job_id && byJob.has(measure.job_id)) byJob.get(measure.job_id).measurementIds.add(measure.id);
        byJob.forEach((info) => {
          if (measure.lead_id && info.job.source_lead_id === measure.lead_id) info.measurementIds.add(measure.id);
        });
      });

      const pairIds = [...new Set([...byJob.values()].flatMap((info) => [...info.pairs].map((pair) => pair.split(':')[1])))].filter(Boolean);
      const measurementIds = [...new Set([...byJob.values()].flatMap((info) => [...info.measurementIds]))].filter(Boolean);
      const rawPhotos = [];
      const photoSelect = 'id, entity_type, entity_id, file_name, storage_path, public_url, caption, category, field_measurement_id, field_measurement_area_id, created_at';

      if (pairIds.length) {
        const result = await supa.from('photo_attachments').select(photoSelect).in('entity_id', pairIds).order('created_at', { ascending: false });
        if (!result.error) rawPhotos.push(...(result.data || []));
      }
      if (measurementIds.length) {
        const result = await supa.from('photo_attachments').select(photoSelect).in('field_measurement_id', measurementIds).order('created_at', { ascending: false });
        if (!result.error) rawPhotos.push(...(result.data || []));
      }

      const tagged = [];
      byJob.forEach((info, jobId) => {
        rawPhotos.forEach((photo) => {
          if (info.pairs.has(`${photo.entity_type}:${photo.entity_id}`) || (photo.field_measurement_id && info.measurementIds.has(photo.field_measurement_id))) {
            tagged.push({ ...photo, __job_id: jobId });
          }
        });
      });
      scheduleJobPhotos = tagged;
    }

        .filter((task) => task.due_date && task.show_on_schedule !== false && task.status !== 'Done')
        .map((task) => ({
          ...task,
          kind: 'task',
          start_date: task.due_date,
          end_date: task.due_date,
          start_time: task.due_time || '',
          end_time: '',
          job_name: task.title,
          customer: task.title,
          address: task.details || '',
          crew: task.assigned_to || ''
        }));
    }

    async function loadPortalTasks() {
      let result = await supa
        .from('tasks')
        .select('id, title, details, status, priority, due_date, due_time, assigned_to, show_on_schedule, completed_at, completed_by, completed_by_name, created_at, updated_at')
        .order('due_date', { ascending: true, nullsFirst: false })
        .order('due_time', { ascending: true });
      if (result.error && String(result.error.message || '').includes('schema cache')) {
        result = await supa
          .from('tasks')
          .select('id, title, details, status, priority, due_date, due_time, assigned_to, show_on_schedule, created_at, updated_at')
          .order('due_date', { ascending: true, nullsFirst: false })
          .order('due_time', { ascending: true });
      }
      portalTasks = result.error ? [] : (result.data || []).filter(taskAssignedToCurrentEmployee);
      await loadTaskAuditLogs();
    }

    async function loadTaskAuditLogs() {
      if (!portalTasks.length) {
        taskAuditLogs = [];
        return;
      }
      const result = await supa
        .from('task_audit_logs')
        .select('id, task_id, actor_user_id, actor_name, action_type, reason, created_at')
        .in('task_id', portalTasks.map((task) => task.id))
        .order('created_at', { ascending: false })
        .limit(100);
      taskAuditLogs = result.error ? [] : (result.data || []);
    }

    async function loadEntries() {
      requireProfile();
      if (isSalaryRole(profile?.role)) {
        entries = [];
        return;
      }
      const result = await supa
        .from('time_entries')
        .select('*')
        .eq('employee_id', profile.employee_id)
        .order('work_date', { ascending: false })
        .order('created_at', { ascending: false })
        .limit(100);
      if (result.error) throw result.error;
      entries = result.data || [];
    }

    async function loadEntryAuditLogs() {
      if (!entries.length) {
        entryAuditLogs = [];
        return;
      }
      const ids = entries.map((entry) => entry.id);
      const result = await supa
        .from('time_entry_audit_logs')
        .select('id, time_entry_id, action_type, previous_values, new_values, reason, created_at')
        .in('time_entry_id', ids)
        .order('created_at', { ascending: false })
        .limit(100);
      if (result.error) throw result.error;
      entryAuditLogs = result.data || [];
    }

    async function loadTimeEntryPhotos() {
      const allEntries = [...entries, ...managerEntries].filter((entry) => entry?.id);
      if (!allEntries.length) {
        timeEntryPhotos = [];
        return;
      }

      const entryIds = [...new Set(allEntries.map((entry) => entry.id).filter(Boolean))];
      const jobIds = [...new Set(allEntries.map((entry) => entry.job_id).filter(Boolean))];
      const photoSelect = 'id, entity_type, entity_id, file_name, storage_path, public_url, caption, category, created_at';
      const photos = [];

      if (entryIds.length) {
        const result = await supa
          .from('photo_attachments')
          .select(photoSelect)
          .eq('entity_type', 'time_entry')
          .in('entity_id', entryIds)
          .order('created_at', { ascending: false });
        if (!result.error) photos.push(...(result.data || []));
      }

      if (jobIds.length) {
        const result = await supa
          .from('photo_attachments')
          .select(photoSelect)
          .eq('entity_type', 'job')
          .in('entity_id', jobIds)
          .eq('category', 'time-entry')
          .order('created_at', { ascending: false });
        if (!result.error) photos.push(...(result.data || []));
      }

      timeEntryPhotos = dedupePhotos(photos);
    }

    async function loadPtoEntries() {
      const response = await fetch(ADMIN_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ action: 'pto_list' })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.error) throw new Error(payload.error || `Could not load PTO (${response.status})`);
      ptoEntries = payload.pto_entries || [];
      ptoBalance = payload.pto_balance || { accrued: 0, ledger: 0, pending: 0, balance: 0, available: 0 };

    async function loadManagerReviewData() {
      if (!canReviewTime()) {
        managerEntries = [];
        managerProfiles = [];
        managerEmployees = [];
        return;
      }

      const [
        { data: timeData, error: timeError },
        { data: profileData, error: profileError }
      ] = await Promise.all([
        supa
          .from('time_entries')
          .select('*')
          .is('deleted_at', null)
          .order('work_date', { ascending: false })
          .order('created_at', { ascending: false })
          .limit(150),
        supa
          .from('profiles')
          .select('id, employee_id, role, full_name, active')
          .order('full_name')
      ]);
      if (timeError) throw timeError;
      if (profileError) throw profileError;

      let employeeResult = await supa
        .from('employees')
        .select('id, name, active, hourly_rate')
        .order('name');
      payRatesColumnAvailable = !employeeResult.error;
      if (employeeResult.error) {
        employeeResult = await supa
          .from('employees')
          .select('id, name, active')
          .order('name');
      }
      if (employeeResult.error) throw employeeResult.error;
      managerProfiles = profileData || [];
      managerEmployees = employeeResult.data || [];
      managerEntries = (timeData || []).filter((entry) => employeeIsActiveForPayroll(entry.employee_id));
    }

      crewOptions = [];
      selectedCrewIds = new Set();

      $('crewTimePanel').classList.remove('hidden');
      $('crewTimeList').innerHTML = '<div class="muted">Loading employees...</div>';

          headers: {

            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ action: 'job_crew_options', job_id: jobId })
        });
        const payload = await response.json().catch(() => ({}));

    function renderSchedule() {
      $('scheduleMonthLabel').textContent = scheduleMonthName(scheduleCalendarMonth);
      const scheduleItems = [
        ...scheduleJobs.map((job) => ({ ...job, kind: 'job' })),
        ...scheduleTasks
      ].sort((a, b) => String(a.start_date || '9999').localeCompare(String(b.start_date || '9999')) || String(a.start_time || '').localeCompare(String(b.start_time || '')));
      if (!scheduleItems.length) {
        $('scheduleList').innerHTML = `
          <div class="muted">No scheduled jobs or assigned tasks are on the calendar yet. Time can still be entered below as Other / No job or against an active job.</div>
        `;
        return;
      }

      if (!scheduleCalendarInitialized && scheduleItems.length) {
        const firstScheduled = scheduleItems.find((item) => item.start_date) || scheduleItems[0];
        const firstDate = scheduleDate(firstScheduled.start_date) || new Date();
        scheduleCalendarMonth = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
        selectedScheduleItemKey = itemKey(firstScheduled);
        scheduleCalendarInitialized = true;
      }

      if (!selectedScheduleItemKey || !scheduleItems.some((item) => itemKey(item) === selectedScheduleItemKey)) {
        selectedScheduleItemKey = itemKey(scheduleItems[0]);
      }

      const firstOfMonth = new Date(scheduleCalendarMonth.getFullYear(), scheduleCalendarMonth.getMonth(), 1);
      const calendarStart = addDays(firstOfMonth, -firstOfMonth.getDay());
      const todayIso = today();
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const heads = dayNames.map((day, index) => `<div class="portal-calendar-head" style="grid-column:${index + 1};grid-row:1;">${day}</div>`).join('');
      const dayMs = 24 * 60 * 60 * 1000;
      const diffDateDays = (left, right) => Math.round((left - right) / dayMs);
      const calendarEnd = addDays(calendarStart, 41);
      const compactCalendar = window.matchMedia('(max-width: 760px)').matches;
      const weekLanes = Array.from({ length: 6 }, () => []);
      const segments = [];
      scheduleItems.forEach((item) => {
        const rawStart = scheduleDate(item.start_date);
        const rawEnd = scheduleDate(item.end_date || item.start_date);
        if (!rawStart || !rawEnd || rawEnd < calendarStart || rawStart > calendarEnd) return;
        const visibleStart = rawStart < calendarStart ? calendarStart : rawStart;
        const visibleEnd = rawEnd > calendarEnd ? calendarEnd : rawEnd;
        const startIndex = diffDateDays(visibleStart, calendarStart);
        const endIndex = diffDateDays(visibleEnd, calendarStart);
        for (let week = Math.floor(startIndex / 7); week <= Math.floor(endIndex / 7); week++) {
          const weekStartIndex = week * 7;
          const segStartIndex = Math.max(startIndex, weekStartIndex);
          const segEndIndex = Math.min(endIndex, weekStartIndex + 6);
          segments.push({
            item,
            week,
            col: (segStartIndex % 7) + 1,
            span: segEndIndex - segStartIndex + 1,
            start: String(item.start_date || ''),
            time: String(item.start_time || ''),
            name: String(item.kind === 'task' ? taskTitle(item) : moneylessJobName(item))
          });
        }
      });
      const bars = segments
        .sort((a, b) => a.week - b.week || a.start.localeCompare(b.start) || a.time.localeCompare(b.time) || a.name.localeCompare(b.name))
        .map((segment) => {
          const lanes = weekLanes[segment.week];
          let lane = lanes.findIndex((days) => {
            for (let col = segment.col; col < segment.col + segment.span; col += 1) {
              if (days[col]) return false;
            }
            return true;
          });
          if (lane < 0) {
            lane = lanes.length;
            lanes.push({});
          }
          for (let col = segment.col; col < segment.col + segment.span; col += 1) {
            lanes[lane][col] = true;
          }
          const top = (compactCalendar ? 25 : 32) + lane * (compactCalendar ? 21 : 30);
          const item = segment.item;
          const eventStyle = portalCalendarColorStyle(item);
          return `
            <button
              type="button"
              class="portal-calendar-event portal-calendar-bar ${item.kind === 'task' ? 'task-event' : ''} ${itemKey(item) === selectedScheduleItemKey ? 'active' : ''}"
              style="grid-column:${segment.col}/span ${segment.span};grid-row:${segment.week + 2};margin-top:${top}px;${eventStyle}"
              onclick="selectScheduleItem('${esc(itemKey(item))}')">
              ${esc(segment.name)}
              <small>${esc(item.kind === 'task' ? ['Task', formatTime(item.start_time), item.status].filter(Boolean).join(' - ') : [formatTime(item.start_time), item.address].filter(Boolean).join(' - ') || item.status || 'Scheduled')}</small>
            </button>
          `;
        }).join('');
      const days = Array.from({ length: 42 }, (_, index) => {
        const date = addDays(calendarStart, index);
        const iso = scheduleIsoDate(date);
        const week = Math.floor(index / 7);
        const col = (index % 7) + 1;
        const classes = [
          'portal-calendar-day',
          date.getMonth() === scheduleCalendarMonth.getMonth() ? '' : 'other-month',
          iso === todayIso ? 'today' : ''
        ].filter(Boolean).join(' ');
        return `
          <div class="${classes}" style="grid-column:${col};grid-row:${week + 2};">
            <div class="portal-calendar-date">${date.getDate()}</div>
          </div>
        `;
      }).join('') + bars;

      const selectedItem = scheduleItems.find((item) => itemKey(item) === selectedScheduleItemKey) || scheduleItems[0];
      const canEditSelectedJob = selectedItem.kind === 'job' && canUpdateScheduleJob(selectedItem);
      const selectedDetail = selectedItem.kind === 'task'
        ? `
        <article class="job-card portal-schedule-detail">
          <header>
            <h3>${esc(taskTitle(selectedItem))}</h3>
            <span class="status">${esc(selectedItem.status || 'Open')}</span>
          </header>
          <div class="facts">
            <div class="fact"><b>When</b>${esc(formatDate(selectedItem.start_date))}${selectedItem.start_time ? ` ${esc(formatTime(selectedItem.start_time))}` : ''}</div>
            <div class="fact"><b>Assigned To</b>${esc(selectedItem.assigned_to || '-')}</div>
            <div class="fact"><b>Priority</b>${esc(selectedItem.priority || 'Normal')}</div>
            <div class="fact"><b>Type</b>Task</div>
          </div>
          ${selectedItem.details ? `<p class="muted">${esc(selectedItem.details)}</p>` : ''}
          ${selectedItem.completed_at ? `<p class="muted">Completed ${esc(new Date(selectedItem.completed_at).toLocaleString())} by ${esc(selectedItem.completed_by_name || 'Unknown')}</p>` : ''}
          <div class="actions">
            ${selectedItem.status !== 'Done' ? `<button class="primary" type="button" onclick="completePortalTask('${esc(selectedItem.id)}', this)">Mark Complete</button>` : ''}
          </div>
          <p class="muted">Tasks can only be completed from the employee portal. Use the dashboard to edit task details.</p>
        </article>`
        : `
        <article class="job-card portal-schedule-detail">
          <header>
            <h3>${esc(moneylessJobName(selectedItem))}</h3>
            <span class="status">${esc(selectedItem.status || 'Scheduled')}</span>
          </header>
          <div class="facts">
            <div class="fact"><b>When</b>${esc(formatRange(selectedItem))}</div>
            <div class="fact"><b>Address</b>${addressLinkHTML(selectedItem.address)}</div>
            <div class="fact"><b>Square Feet</b>${Number(selectedItem.square_feet || 0).toLocaleString()}</div>
            <div class="fact"><b>Crew Lead</b>${esc(scheduleLeadForJob(selectedItem))}</div>
          </div>
          ${scheduleMapHTML(selectedItem.address)}
          ${selectedItem.notes ? `<p class="muted">${esc(selectedItem.notes)}</p>` : ''}
          ${selectedItem.material_notes ? `<p class="muted">${esc(selectedItem.material_notes)}</p>` : ''}
          <div class="schedule-actions">
            <a class="button-link" href="${esc(scheduleJobUrl(selectedItem, 'materials'))}" target="_blank" rel="noopener">Material List</a>
          </div>
          ${compactMaterialListHTML(selectedItem)}
          ${jobPhotosHTML(selectedItem)}
          ${canEditSelectedJob ? `
            <div class="schedule-update-form">
              <label for="scheduleNote_${esc(selectedItem.id)}">Add Job Note</label>
              <textarea id="scheduleNote_${esc(selectedItem.id)}" placeholder="Crew notes, job progress, prep concerns, or anything the office should know."></textarea>
              <label for="schedulePhotos_${esc(selectedItem.id)}">Add Job Photos / Files</label>
              <input id="schedulePhotos_${esc(selectedItem.id)}" type="file" accept="image/*,application/pdf,.pdf" multiple>
              <div class="actions">
                <button class="primary" type="button" onclick="saveScheduleJobUpdate('${esc(selectedItem.id)}', this)">Save Note / Files</button>
              </div>
              <p class="muted">Schedule dates and job details are read-only in the employee portal.</p>
            </div>
          ` : `
            <p class="muted">This job is read-only here. The assigned lead, managers, and admins can add job notes or files from the employee portal.</p>
          `}
        </article>`;
      $('scheduleList').innerHTML = `
        <div class="portal-calendar" aria-label="Production schedule calendar">
          <div class="portal-calendar-month"><span>${esc(scheduleMonthName(scheduleCalendarMonth))}</span><small>Swipe to change month</small></div>
          <div class="portal-calendar-grid" ontouchstart="scheduleSwipeBegin(event)" ontouchmove="scheduleSwipeMove(event)" ontouchend="scheduleSwipeEnd(event)" ontouchcancel="scheduleSwipeEnd(event)">${heads}${days}</div>
        </div>
        ${selectedDetail}
      `;
    }

    window.setTaskSearch = function setTaskSearch(value) {

    window.completePortalTask = async function completePortalTask(id, button = null) {
      const task = portalTasks.find((item) => item.id === id);
      if (!task || task.status === 'Done') return;
      if (setActionButtonBusy(button, true, 'Completing...') === false) return;
      const actorName = profile?.full_name || session?.user?.email || 'Employee';
      const stamp = new Date().toISOString();
      const payload = {
        status: 'Done',
        completed_at: stamp,
        completed_by: session?.user?.id || null,
        completed_by_name: actorName
      };
      try {
        let result = await supa.from('tasks').update(payload).eq('id', id);
        if (result.error && String(result.error.message || '').includes('schema cache')) {
          result = await supa.from('tasks').update({ status: 'Done' }).eq('id', id);
        }
        if (result.error) throw result.error;
        const auditResult = await supa.from('task_audit_logs').insert({
          task_id: id,
          actor_user_id: session?.user?.id || null,
          actor_name: actorName,
          action_type: 'completed',
          previous_values: task,
          new_values: { ...task, ...payload },
          reason: 'Marked complete from employee portal',
          device_info: deviceInfo()
        });
        setMessage('appMessage', auditResult.error ? 'Task marked complete. Run the task audit SQL migration to keep completion logs across devices.' : 'Task marked complete.');
        await refresh();
        setActiveTab('tasks');
      } catch (error) {
        setMessage('appMessage', error.message, true);
      } finally {
        setActionButtonBusy(button, false);
      }
    };

    window.shiftScheduleCalendar = function shiftScheduleCalendar(months) {
      scheduleCalendarMonth = new Date(scheduleCalendarMonth.getFullYear(), scheduleCalendarMonth.getMonth() + months, 1);
      renderSchedule();
    };

    let scheduleSwipeStart = null;

    window.scheduleSwipeBegin = function scheduleSwipeBegin(event) {
      const touch = event.touches && event.touches[0];
      if (!touch) return;
      scheduleSwipeStart = { x: touch.clientX, y: touch.clientY, time: Date.now(), el: event.currentTarget };
      event.currentTarget.style.transition = 'none';
    };

    window.scheduleSwipeMove = function scheduleSwipeMove(event) {
      if (!scheduleSwipeStart) return;
      const touch = event.touches && event.touches[0];
      if (!touch) return;
      const dx = touch.clientX - scheduleSwipeStart.x;
      const dy = touch.clientY - scheduleSwipeStart.y;
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
      event.preventDefault();
      const pull = Math.max(-120, Math.min(120, dx));
      scheduleSwipeStart.el.style.transform = `translateX(${pull}px)`;
      scheduleSwipeStart.el.style.opacity = String(Math.max(0.72, 1 - Math.abs(pull) / 420));
    };

    window.scheduleSwipeEnd = function scheduleSwipeEnd(event) {
      if (!scheduleSwipeStart) return;
      const touch = event.changedTouches && event.changedTouches[0];
      const start = scheduleSwipeStart;
      const el = start.el;
      scheduleSwipeStart = null;
      if (!touch) {
        return;
      }
      const dx = touch.clientX - start.x;
      const dy = touch.clientY - start.y;
      const dt = Math.max(1, Date.now() - start.time);
      const speed = Math.abs(dx) / dt;
      const duration = Math.max(140, Math.min(320, 260 - speed * 70));
      el.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;
      if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.35) {
        el.style.transform = 'translateX(0)';
        el.style.opacity = '1';
        return;
      }
      const dir = dx < 0 ? 1 : -1;
      el.style.transform = `translateX(${-dir * 28}%)`;
      el.style.opacity = '.38';
      setTimeout(() => {
        shiftScheduleCalendar(dir);
        requestAnimationFrame(() => {
          const next = document.querySelector('#scheduleList .portal-calendar-grid');
          if (!next) return;
          next.style.transition = 'none';
          next.style.transform = `translateX(${dir * 18}%)`;
          next.style.opacity = '.5';
          requestAnimationFrame(() => {
            next.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;
            next.style.transform = 'translateX(0)';
            next.style.opacity = '1';
          });
        });
      }, Math.round(duration * 0.45));
    };

    window.goToScheduleToday = function goToScheduleToday() {

      scheduleCalendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);

      const approved = entries.filter((entry) => entry.status === 'approved').reduce((sum, entry) => sum + Number(entry.total_hours || 0), 0);

    window.setEntryReviewView = function setEntryReviewView(view) {
      entryReviewView = view === 'rejected' ? 'rejected' : 'accepted';
      renderEntries();
    };

    function employeeName(employeeId) {
      const profileItem = managerProfiles.find((item) => item.employee_id === employeeId);
      const employeeItem = managerEmployees.find((item) => item.id === employeeId);
      return profileItem?.full_name || employeeItem?.name || 'Employee';
    }

    function employeeProfile(employeeId) {
      return managerProfiles.find((item) => item.employee_id === employeeId);
    }

    function employeeById(employeeId) {
      return managerEmployees.find((item) => item.id === employeeId);
    }

    function employeeHourlyRate(employeeId) {
      return Number(employeeById(employeeId)?.hourly_rate || 0);
    }

    function employeeIsActiveForPayroll(employeeId) {
      const profileItem = employeeProfile(employeeId);
      if (['manager', 'admin'].includes(profileItem?.role)) return false;
      const employeeItem = employeeById(employeeId);
      if (!employeeItem || employeeItem.active === false) return false;
      return !String(employeeItem.name || '').toLowerCase().startsWith('removed employee');
    }

    function payrollEmployees() {
      return managerEmployees
        .filter((employee) => employeeIsActiveForPayroll(employee.id))
        .sort((a, b) => employeeName(a.id).localeCompare(employeeName(b.id)));
    }

    function jobName(jobId) {
      const job = jobs.find((item) => item.id === jobId);
      return job ? moneylessJobName(job) : 'Other / No job';
    }

    function isPtoTimeEntry(entry) {
      return !entry?.job_id && /^PTO Request\b/i.test(String(entry?.notes || ''));
    }

    function timeEntryJobLabel(entry) {
      return isPtoTimeEntry(entry) ? 'PTO Request' : jobName(entry?.job_id);
    }

    function reviewGroupKey(entry) {
      return [
        entry.status || 'draft',
        entry.job_id || 'other',
        entry.work_date || '',
        String(entry.start_time || '').slice(0, 5),
        String(entry.end_time || '').slice(0, 5),
        Number(entry.total_hours || 0).toFixed(2),
        entry.notes || '',
        entry.rejection_reason || ''
      ].join('|');
    }

    function managerTimeGroups() {
      const grouped = new Map();
      for (const entry of managerEntries) {
        const key = reviewGroupKey(entry);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(entry);
      }
      return Array.from(grouped.values()).map((items) => ({
        id: items.map((entry) => entry.id).join(','),
        entries: items,
        entry: items[0],
        employees: items.map((entry) => employeeName(entry.employee_id)).sort((a, b) => a.localeCompare(b))
      }));
    }

    function groupLabel(group) {
      return group.employees.length > 1 ? `${group.employees.length} employees` : group.employees[0] || 'Employee';
    }

    function renderManagerReview() {
      $('managerReviewCard').classList.toggle('hidden', !canReviewTime());
      if (!canReviewTime()) {
        $('managerTimeList').innerHTML = '';
        $('managerReviewMode').innerHTML = '';
        $('managerReviewFooter').innerHTML = '';
        $('managerTimeForm').classList.add('hidden');
        return;
      }

      const groups = managerTimeGroups();
      const approvedGroups = groups.filter((group) => group.entry.status === 'approved');
      const rejectedGroups = groups.filter((group) => group.entry.status === 'rejected');
      const pendingGroups = groups.filter((group) => !['approved', 'rejected'].includes(group.entry.status));
      const visibleGroups = managerReviewView === 'approved'
        ? approvedGroups
        : managerReviewView === 'rejected'
          ? rejectedGroups
          : pendingGroups;

      $('managerReviewMode').innerHTML = `
        <button class="${managerReviewView === 'pending' ? 'primary' : ''}" type="button" onclick="setManagerReviewView('pending')">Pending Review (${pendingGroups.length})</button>
        <button class="${managerReviewView === 'approved' ? 'primary' : ''}" type="button" onclick="setManagerReviewView('approved')">Approved Time (${approvedGroups.length})</button>
        <button class="${managerReviewView === 'rejected' ? 'primary' : ''}" type="button" onclick="setManagerReviewView('rejected')">Rejected Time (${rejectedGroups.length})</button>
      `;
      $('managerReviewFooter').innerHTML = managerReviewView !== 'pending'
        ? '<button type="button" onclick="setManagerReviewView(\'pending\')">Back to Pending Review</button>'
        : '<button type="button" onclick="setManagerReviewView(\'approved\')">View Approved Time</button><button type="button" onclick="setManagerReviewView(\'rejected\')">View Rejected Time</button>';

      if (!visibleGroups.length) {
        $('managerTimeList').innerHTML = `<div class="muted">${managerReviewView === 'approved' ? 'No approved time entries yet.' : managerReviewView === 'rejected' ? 'No rejected time entries.' : 'No pending time entries to review.'}</div>`;
        return;
      }

      const sortedGroups = [...visibleGroups].sort((a, b) => {
        const statusRank = { submitted: 0, rejected: 1, draft: 2, approved: 3 };
        const aRank = statusRank[a.entry.status] ?? 9;
        const bRank = statusRank[b.entry.status] ?? 9;
        if (aRank !== bRank) return aRank - bRank;
        return String(b.entry.work_date || '').localeCompare(String(a.entry.work_date || ''));
      });

      $('managerTimeList').innerHTML = sortedGroups.map((group) => {
        const entry = group.entry;
        const names = group.employees.join(', ');
        return `
        <article class="entry-card">
          <header>
            <div>
              <h3>${esc(groupLabel(group))}</h3>
              <span class="muted">${esc(timeEntryJobLabel(entry))}</span>
            </div>
            <span class="status ${statusClass(entry.status)}">${esc(entry.status || 'draft')}</span>
          </header>
          <div class="facts">
            <div class="fact"><b>Date</b>${esc(formatDate(entry.work_date))}</div>
            <div class="fact"><b>Time</b>${esc(formatTime(entry.start_time))} - ${esc(formatTime(entry.end_time))}</div>
            <div class="fact"><b>Total</b>${Number(entry.total_hours || 0).toFixed(2)} hours</div>
            <div class="fact"><b>Submitted</b>${entry.submitted_at ? esc(new Date(entry.submitted_at).toLocaleDateString()) : '-'}</div>
          </div>
          <p class="muted">${esc(names)}</p>
          ${entry.notes ? `<p class="muted">${esc(entry.notes)}</p>` : ''}
          ${entry.rejection_reason ? `<p class="muted">Rejected: ${esc(entry.rejection_reason)}</p>` : ''}
          ${timeEntryPhotosHTML(group.entries)}
          <div class="actions">
            ${entry.status !== 'approved' ? `<button class="primary" type="button" onclick="approveManagerGroup('${esc(group.id)}', this)">Approve Group</button>` : ''}
            <button type="button" onclick="editManagerGroup('${esc(group.id)}')">Edit Group</button>
          </div>
        </article>
      `;
      }).join('');
    }

    window.setManagerReviewView = function setManagerReviewView(view) {
      managerReviewView = ['approved', 'rejected'].includes(view) ? view : 'pending';
      renderManagerReview();
    };

    function entriesForPeriod(startDate) {
      const start = isoDate(startDate);
      const end = isoDate(addDays(startDate, 6));
      return entries.filter((entry) => entry.work_date >= start && entry.work_date <= end && !entry.deleted_at);
    }

    function periodRangeLabel(startDate) {
      return `${formatDate(isoDate(startDate))} - ${formatDate(isoDate(addDays(startDate, 6)))}`;
    }

    function periodSummary(label, startDate) {
      const periodEntries = entriesForPeriod(startDate);
      const entryIds = new Set(periodEntries.map((entry) => entry.id));
      const changes = entryAuditLogs.filter((log) => entryIds.has(log.time_entry_id) && !['created'].includes(log.action_type));
      const acceptedEntries = periodEntries.filter((entry) => ['approved', 'submitted'].includes(entry.status));
      const total = acceptedEntries.reduce((sum, entry) => sum + Number(entry.total_hours || 0), 0);
      const byJob = new Map();
      for (const entry of acceptedEntries) {
        const job = jobs.find((item) => item.id === entry.job_id);
        const name = isPtoTimeEntry(entry) ? 'PTO Request' : job ? moneylessJobName(job) : 'Other / No job';
        byJob.set(name, (byJob.get(name) || 0) + Number(entry.total_hours || 0));
      }

      return `
        <article class="entry-card">
          <header>
            <div>
              <h3>${label}</h3>
              <span class="muted">${esc(periodRangeLabel(startDate))}</span>
            </div>
            <span class="status approved">${total.toFixed(2)} hrs</span>
          </header>
          <details>
            <summary>Job Summary</summary>
            ${byJob.size ? Array.from(byJob.entries()).map(([name, hours]) => `<p class="muted"><b>${esc(name)}</b>: ${hours.toFixed(2)} hrs</p>`).join('') : '<p class="muted">No time logged.</p>'}
          </details>
          ${changes.length ? `<details><summary>Changes</summary>${changes.map((log) => `<p class="muted">${esc(new Date(log.created_at).toLocaleString())} - ${esc(log.action_type)}${log.reason ? `: ${esc(log.reason)}` : ''}</p>`).join('')}</details>` : ''}
        </article>
      `;
    }

    function payPeriodStartOptions() {
      const starts = new Set();
      const thisStart = payPeriodStart(today());
      for (let i = 0; i < 12; i += 1) {
        starts.add(isoDate(addDays(thisStart, -7 * i)));
      }
      for (const entry of managerEntries) {
        if (entry.work_date) starts.add(isoDate(payPeriodStart(entry.work_date)));
      }
      return Array.from(starts).sort((a, b) => b.localeCompare(a));
    }

    function renderPayPeriodControls(options) {
      if (!canReviewTime()) {
        $('payPeriodControls').innerHTML = '';
        return;
      }
      const currentStart = isoDate(payPeriodStart(today()));
      if (!payPeriodManuallySelected && options.includes(currentStart)) {
        selectedPayPeriodStart = currentStart;
      } else if (!selectedPayPeriodStart || !options.includes(selectedPayPeriodStart)) {
        selectedPayPeriodStart = options.includes(currentStart) ? currentStart : options[0] || currentStart;
        payPeriodManuallySelected = false;
      }
      $('payPeriodControls').innerHTML = `
        <label for="payPeriodSelect">Pay Period</label>
        <select id="payPeriodSelect" onchange="setPayPeriodStart(this.value)">
          ${options.map((start) => `<option value="${esc(start)}" ${start === selectedPayPeriodStart ? 'selected' : ''}>${esc(periodRangeLabel(dateOnly(start)))}</option>`).join('')}
        </select>
      `;
    }

    function formatHoursValue(value) {
      const number = Number(value || 0);
      return number ? number.toFixed(2).replace(/\.00$/, '') : '';
    }

    function managerPeriodSummary() {
      const options = payPeriodStartOptions();
      renderPayPeriodControls(options);
      const startDate = dateOnly(selectedPayPeriodStart || options[0] || today());
      const start = isoDate(startDate);
      const end = isoDate(addDays(startDate, 6));
      const days = Array.from({ length: 7 }, (_, index) => {
        const date = addDays(startDate, index);
        const iso = isoDate(date);
        return {
          iso,
          label: date.toLocaleDateString(undefined, { weekday: 'short' }),
          dateLabel: date.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' })
        };
      });
      const periodEntries = managerEntries.filter((entry) => entry.work_date >= start && entry.work_date <= end && !entry.deleted_at);
      const approvedEntries = periodEntries.filter((entry) => entry.status === 'approved' && employeeIsActiveForPayroll(entry.employee_id));
      const employees = new Map();
      const byStatus = new Map();

      for (const entry of approvedEntries) {
        const employeeId = entry.employee_id || 'unknown';
        const name = employeeName(employeeId);
        const hours = Number(entry.total_hours || 0);
        if (!employees.has(employeeId)) {
          employees.set(employeeId, {
            name,
            employeeId,
            hourlyRate: employeeHourlyRate(employeeId),
            dayHours: Object.fromEntries(days.map((day) => [day.iso, 0])),
            total: 0,
            entries: []
          });
        }
        const row = employees.get(employeeId);
        if (row.dayHours[entry.work_date] !== undefined) row.dayHours[entry.work_date] += hours;
        row.total += hours;
        row.entries.push(entry);
        byStatus.set(entry.status || 'draft', (byStatus.get(entry.status || 'draft') || 0) + hours);
      }

      const rows = Array.from(employees.values()).sort((a, b) => a.name.localeCompare(b.name));
      const dayTotals = Object.fromEntries(days.map((day) => [day.iso, 0]));
      let totalHours = 0;
      let regularHours = 0;
      let overtimeHours = 0;
      let regularPayTotal = 0;
      let overtimePayTotal = 0;
      let totalPayTotal = 0;

      for (const row of rows) {
        row.regular = Math.min(row.total, 40);
        row.overtime = Math.max(row.total - 40, 0);
        row.regularPay = row.regular * row.hourlyRate;
        row.overtimePay = row.overtime * row.hourlyRate * 1.5;
        row.totalPay = row.regularPay + row.overtimePay;
        totalHours += row.total;
        regularHours += row.regular;
        overtimeHours += row.overtime;
        regularPayTotal += row.regularPay;
        overtimePayTotal += row.overtimePay;
        totalPayTotal += row.totalPay;
        for (const day of days) dayTotals[day.iso] += row.dayHours[day.iso] || 0;
      }

      const noteEntries = approvedEntries
        .filter((entry) => entry.notes)
        .sort((a, b) => String(a.work_date || '').localeCompare(String(b.work_date || '')) || employeeName(a.employee_id).localeCompare(employeeName(b.employee_id)));
      const noteGroups = new Map();
      for (const entry of noteEntries) {
        const key = reviewGroupKey(entry);
        if (!noteGroups.has(key)) noteGroups.set(key, []);
        noteGroups.get(key).push(entry);
      }
      const notesByDay = Object.fromEntries(days.map((day) => [day.iso, []]));
      const groupedNotes = Array.from(noteGroups.values())
        .map((items) => ({
          entry: items[0],
          employees: items.map((entry) => employeeName(entry.employee_id)).sort((a, b) => a.localeCompare(b))
        }))
        .sort((a, b) => String(a.entry.work_date || '').localeCompare(String(b.entry.work_date || '')) || String(a.entry.start_time || '').localeCompare(String(b.entry.start_time || '')));
      for (const group of groupedNotes) {
        if (notesByDay[group.entry.work_date]) notesByDay[group.entry.work_date].push(group);
      }
      const mobileWeek = days.map((day) => {
        const dayRows = rows.filter((row) => row.dayHours[day.iso]);
        return `
          <section class="mobile-week-day">
            <header>
              <div>
                <b>${esc(day.label)} ${esc(day.dateLabel)}</b>
                <div class="muted">${esc(new Date(day.iso + 'T00:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }))}</div>
              </div>
              <span class="status approved">${(dayTotals[day.iso] || 0).toFixed(2)} hrs</span>
            </header>
            ${dayRows.length ? dayRows.map((row) => `
              <div class="mobile-week-row">
                <div>
                  <b>${esc(row.name)}</b>
                  <div class="muted">Approved time</div>
                </div>
                <strong>${(row.dayHours[day.iso] || 0).toFixed(2)}</strong>
              </div>
            `).join('') : '<div class="mobile-week-empty">-</div>'}
            <div class="mobile-week-notes">
              <b>Notes</b>
              ${notesByDay[day.iso].length ? notesByDay[day.iso].map((group) => `
                <div class="timesheet-note">
                  <b>${esc(groupLabel(group))}</b>
                  <span class="muted">${esc(timeEntryJobLabel(group.entry))} - ${esc(formatTime(group.entry.start_time))} to ${esc(formatTime(group.entry.end_time))}</span>
                  <div>${esc(group.entry.notes)}</div>
                </div>
              `).join('') : '<div class="muted">No notes.</div>'}
            </div>
          </section>
        `;
      }).join('');

      return `
        <article class="entry-card weekly-print-target">
          <div class="weekly-tools">
          <header>
            <div>
              <h3>Weekly Timesheet</h3>
              <span class="muted">${esc(periodRangeLabel(startDate))}</span>
            </div>
            <span class="status approved">${totalHours.toFixed(2)} hrs</span>
          </header>
          <button class="ghost no-print" type="button" onclick="printWeeklyTimesheet()">Share / Save PDF</button>
          </div>
          <div class="mobile-timesheet">${mobileWeek}</div>
          <div class="timesheet-wrap">
            <table class="timesheet">
              <thead>
                <tr>
                  <th class="employee-col">Employee</th>
                  ${days.map((day) => `<th>${esc(day.label)}<br>${esc(day.dateLabel)}</th>`).join('')}
                  <th>Total<br>Hours</th>
                  <th>Reg<br>Time</th>
                  <th>Over<br>Time</th>
                  <th>Reg<br>Pay</th>
                  <th>OT<br>Pay</th>
                  <th>Total<br>Pay</th>
                  <th>Hourly<br>Rate</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows.map((row) => `
                  <tr>
                    <td class="employee-col">${esc(row.name)}</td>
                    ${days.map((day) => `<td>${esc(formatHoursValue(row.dayHours[day.iso]))}</td>`).join('')}
                    <td class="total-col">${row.total.toFixed(2)}</td>
                    <td>${row.regular.toFixed(2)}</td>
                    <td class="overtime-col">${row.overtime ? row.overtime.toFixed(2) : ''}</td>
                    <td class="pay-col">${money(row.regularPay)}</td>
                    <td class="pay-col">${row.overtimePay ? money(row.overtimePay) : ''}</td>
                    <td class="pay-col">${money(row.totalPay)}</td>
                    <td>${money(row.hourlyRate)}</td>
                  </tr>
                `).join('') : `<tr><td class="employee-col">No approved hours</td><td colspan="14" class="muted">No approved time logged for this pay period.</td></tr>`}
              </tbody>
              <tfoot>
                <tr class="timesheet-foot">
                  <td class="employee-col">Totals</td>
                  ${days.map((day) => `<td>${esc(formatHoursValue(dayTotals[day.iso]))}</td>`).join('')}
                  <td>${totalHours.toFixed(2)}</td>
                  <td>${regularHours.toFixed(2)}</td>
                  <td>${overtimeHours.toFixed(2)}</td>
                  <td>${money(regularPayTotal)}</td>
                  <td>${money(overtimePayTotal)}</td>
                  <td>${money(totalPayTotal)}</td>
                  <td></td>
                </tr>
                <tr class="timesheet-notes-row">
                  <td class="employee-col">Notes</td>
                  ${days.map((day) => `
                    <td>
                      ${notesByDay[day.iso].length ? notesByDay[day.iso].map((group) => `
                        <div class="timesheet-note">
                          <b>${esc(groupLabel(group))}</b><br>
                          <span class="muted">${esc(timeEntryJobLabel(group.entry))} - ${esc(formatTime(group.entry.start_time))} to ${esc(formatTime(group.entry.end_time))}</span><br>
                          ${esc(group.entry.notes)}
                        </div>
                      `).join('') : '<span class="muted">No notes.</span>'}
                    </td>
                  `).join('')}
                  <td colspan="7" class="muted">Notes are grouped by work day.</td>
                </tr>
              </tfoot>
            </table>
          </div>

    async function uploadTimePhotos(entry, jobId) {
      const input = $('timePhotos');
      if (!input?.files?.length) return '';

      const files = Array.from(input.files);
      if (!confirmLargeUploads(files)) return 'Upload canceled.';
      const targetType = jobId ? 'job' : 'time_entry';
      const targetId = jobId || entry.id;
      const uploadedBy = profile?.full_name || session?.user?.email || 'employee-portal';

      for (const file of files) {
        const uploadFile = await prepareUploadFile(file);
        const path = `${targetType}/${targetId}/time-entry/${entry.id}/${Date.now()}_${safeStorageName(uploadFile.name)}`;
        const upload = await supa.storage.from('sefs-photos').upload(path, uploadFile, {
          upsert: false,
          cacheControl: '3600',
          contentType: inferFileType(uploadFile)
        });
        if (upload.error) throw new Error(upload.error.message);

        const publicUrl = supa.storage.from('sefs-photos').getPublicUrl(path).data.publicUrl;
        const caption = jobId
          ? `Time entry attachment - ${formatDate(entry.work_date)}`
          : `Other time entry attachment - ${formatDate(entry.work_date)}`;
        const saved = await supa.from('photo_attachments').insert({
          entity_type: targetType,
          entity_id: targetId,
          file_name: uploadFile.name,
          storage_path: path,
          public_url: publicUrl,
          caption,
          category: 'time-entry',
          uploaded_by: uploadedBy
        });
        if (saved.error) throw new Error(saved.error.message);
      }

      return `${files.length} file${files.length === 1 ? '' : 's'} uploaded${jobId ? ' and attached to the job' : ' to the time entry'}.`;
    }
