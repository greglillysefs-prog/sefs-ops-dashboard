<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEFS Employee Portal</title>
  <link rel="icon" href="assets/sefs-icon.jpeg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050505;
      --panel: #111;
      --panel2: #181818;
      --line: #333;
      --text: #f4f4f4;
      --muted: #a8a8a8;
      --orange: #ff7a00;
      --orange2: #ff9b33;
      --good: #15c77a;
      --bad: #ff6262;
      --warn: #ffd166;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(255, 122, 0, .12), transparent 30rem), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--orange);
      background: linear-gradient(180deg, #222, #141414);
      color: var(--text);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 800;
      letter-spacing: 0;
    }

    button.primary {
      background: var(--orange);
      color: #111;
      border-color: var(--orange);
    }

    button.ghost {
      border-color: var(--line);
      color: var(--muted);
    }

    a.ghost {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #222, #141414);
      color: var(--muted);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 800;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
    }

    button:disabled {
      opacity: .55;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #101010;
      color: var(--text);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 12px;
    }

    select option {
      background: #050505;
      color: #fff;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    label {
      display: block;
      color: #d8d8d8;
      font-size: 12px;
      font-weight: 900;
      margin: 0 0 6px;
      text-transform: uppercase;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #292929;
    }

    .brand h1 {
      font-size: clamp(22px, 5vw, 34px);
      line-height: 1;
      margin: 0;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 16px;
      align-items: start;
    }

    .grid > * {
      min-width: 0;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      min-width: 0;
    }

    .card + .card {
      margin-top: 16px;
    }

    .crew-view .shell,
    .manager-view .shell {
      width: min(1500px, 100%);
    }

    .crew-view .grid {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
    }

    .manager-view .grid {
      grid-template-columns: minmax(380px, .9fr) minmax(560px, 1.1fr);
    }

    .crew-view #timePanel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .crew-view #timePanel .card {
      margin-top: 0;
    }

    .pay-periods-wide {
      margin-top: 16px;
      width: 100%;
    }

    .manager-top-stack {
      display: grid;
      gap: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: 20px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .card-head h2 {
      margin: 0;
    }

    .card-head a {
      text-decoration: none;
    }

    .card h2:before {
      content: "";
      width: 28px;
      height: 3px;
      background: var(--orange);
      border-radius: 999px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .full { grid-column: 1 / -1; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .password-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .password-control button {
      min-width: 90px;
    }

    .crew-selected {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .crew-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 122, 0, .5);
      background: rgba(255, 122, 0, .1);
      border-radius: 999px;
      padding: 6px 8px 6px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .crew-chip button {
      border-color: rgba(255,255,255,.2);
      border-radius: 999px;
      min-height: 28px;
      min-width: 28px;
      padding: 0;
      line-height: 1;
    }

    .crew-check-list {
      display: grid;
      gap: 8px;
    }

    .crew-check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }

    .crew-check input {
      width: 20px;
      min-height: 20px;
      accent-color: var(--orange);
    }

    .crew-check b {
      display: block;
    }

    .status {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
    }

    .status.draft { color: var(--muted); }
    .status.submitted { color: var(--warn); border-color: rgba(255,209,102,.55); }
    .status.approved { color: var(--good); border-color: rgba(21,199,122,.55); }
    .status.rejected { color: var(--bad); border-color: rgba(255,98,98,.55); }

    .muted {
      color: var(--muted);
    }

    .notice {
      border: 1px solid rgba(255, 122, 0, .45);
      background: rgba(255, 122, 0, .08);
      color: #ffd7b0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .error {
      border-color: rgba(255, 98, 98, .6);
      background: rgba(255, 98, 98, .08);
      color: #ffc4c4;
    }

    .job-list, .entry-list {
      display: grid;
      gap: 10px;
    }

    .job-card, .entry-card {
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }

    .job-card header, .entry-card header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .job-card h3, .entry-card h3 {
      margin: 0;
      font-size: 16px;
    }

    .schedule-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .schedule-card-head h2 {
      margin: 0;
    }

    .schedule-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .schedule-nav button {
      min-height: 38px;
      padding: 8px 12px;
    }

    .schedule-month {
      color: #fff;
      font-weight: 900;
      min-width: 150px;
      text-align: center;
    }

    .portal-calendar {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0,0,0,.24);
    }

    .portal-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .portal-calendar-head {
      background: rgba(255,122,0,.16);
      border-right: 1px solid var(--line);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 8px 6px;
      text-align: center;
      text-transform: uppercase;
    }

    .portal-calendar-head:nth-child(7) {
      border-right: 0;
    }

    .portal-calendar-day {
      min-height: 112px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      background: rgba(255,255,255,.018);
    }

    .portal-calendar-day:nth-child(7n) {
      border-right: 0;
    }

    .portal-calendar-day.other-month {
      opacity: .42;
    }

    .portal-calendar-day.today {
      box-shadow: inset 0 0 0 2px rgba(255,122,0,.65);
    }

    .portal-calendar-date {
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .portal-calendar-event {
      display: block;
      width: 100%;
      min-height: 0;
      margin: 5px 0 0;
      padding: 7px;
      border-color: rgba(255,122,0,.5);
      background: linear-gradient(180deg, rgba(255,122,0,.2), rgba(255,122,0,.07));
      color: #fff;
      border-radius: 6px;
      text-align: left;
      font-size: 12px;
      line-height: 1.25;
      text-transform: none;
    }

    .portal-calendar-event.active {
      background: var(--orange);
      color: #111;
    }

    .portal-calendar-event small {
      display: block;
      margin-top: 3px;
      color: inherit;
      opacity: .78;
      font-weight: 700;
    }

    .portal-schedule-detail {
      margin-top: 12px;
    }

    .schedule-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .button-link {
      border: 1px solid var(--orange);
      background: linear-gradient(180deg, #222, #141414);
      color: var(--text);
      border-radius: 8px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .schedule-update-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .fact b {
      display: block;
      color: #eee;
      font-size: 12px;
      text-transform: uppercase;
    }

    .timesheet-wrap {
      max-width: 100%;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
    }

    .timesheet {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    .timesheet th,
    .timesheet td {
      border: 1px solid rgba(255,255,255,.12);
      padding: 9px 8px;
      text-align: center;
      vertical-align: middle;
    }

    .manager-view .timesheet th,
    .manager-view .timesheet td {
      padding: 8px 5px;
      font-size: 11px;
    }

    .timesheet thead th {
      background: rgba(255,122,0,.18);
      color: #fff;
      font-size: 12px;
      text-transform: uppercase;
    }

    .timesheet .employee-col {
      position: sticky;
      left: 0;
      z-index: 1;
      width: 140px;
      text-align: left;
      background: #111;
      color: #fff;
      font-weight: 900;
    }

    .timesheet tbody tr:nth-child(even) td {
      background: rgba(255,255,255,.025);
    }

    .timesheet tbody tr:nth-child(even) .employee-col {
      background: #111;
    }

    .timesheet .total-col {
      background: rgba(255,122,0,.12);
      color: var(--orange2);
      font-weight: 900;
    }

    .timesheet .overtime-col {
      background: rgba(255,98,98,.1);
      color: #ffb8b8;
      font-weight: 900;
    }

    .timesheet .pay-col {
      background: rgba(21,199,122,.08);
      color: #d8ffee;
      font-weight: 900;
    }

    .pay-rate-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .pay-rate-table th,
    .pay-rate-table td {
      border-bottom: 1px solid rgba(255,255,255,.1);
      padding: 8px 0;
      text-align: left;
    }

    .pay-rate-table th:last-child,
    .pay-rate-table td:last-child {
      text-align: right;
      width: 140px;
    }

    .pay-rate-table input {
      min-height: 36px;
      padding: 7px 9px;
      text-align: right;
    }

    .timesheet-foot {
      background: rgba(255,122,0,.16);
      font-weight: 900;
    }

    .timesheet-notes-row td {
      vertical-align: top;
    }

    .timesheet-note {
      margin-top: 5px;
      border-top: 1px solid rgba(255,255,255,.12);
      padding-top: 5px;
      color: #e6e6e6;
      font-size: 10px;
      line-height: 1.3;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .timesheet-note + .timesheet-note {
      margin-top: 6px;
    }

    .weekly-tools {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .weekly-tools header {
      margin: 0;
    }

    .weekly-tools button {
      min-height: 38px;
      padding: 8px 12px;
    }

    .hours {
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      color: var(--orange2);
    }

    .totals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .total {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(0,0,0,.25);
    }

    .total b {
      display: block;
      font-size: 24px;
      color: var(--orange2);
    }

    .tabs {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .mobile-tab-select-wrap {
      display: none;
      margin-bottom: 12px;
    }

    .mobile-tab-select-wrap select {
      border-color: var(--orange);
      font-weight: 900;
      min-height: 46px;
    }

    .hidden { display: none !important; }

    @media (max-width: 1200px) {
      .manager-view .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 980px) {
      .crew-view .grid {
        grid-template-columns: 1fr;
      }

      .crew-view #timePanel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .mobile-tab-select-wrap {
        display: block;
      }

      .mobile-panel.hidden-mobile {
        display: none;
      }

      .pay-periods-wide {
        margin-top: 12px;
      }
    }

    @media (max-width: 620px) {
      .shell {
        padding: 10px;
        width: 100%;
      }

      .topbar {
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .form-grid, .facts, .totals {
        grid-template-columns: 1fr;
      }

      .actions button, .topbar button {
        flex: 1 1 auto;
      }

      .mobile-tab-select-wrap {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(5,5,5,.94);
        padding: 6px 0;
      }

      .card {
        padding: 14px;
      }

      .job-card header,
      .entry-card header,
      .card-head,
      .schedule-card-head {
        display: grid;
        grid-template-columns: 1fr;
      }

      .schedule-nav {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .schedule-month {
        grid-column: 1 / -1;
        order: -1;
        text-align: left;
      }

      .password-control {
        grid-template-columns: 1fr;
      }

      .password-control button {
        width: 100%;
      }

      .timesheet-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .timesheet {
        min-width: 760px;
      }

      .portal-calendar {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .portal-calendar-grid {
        min-width: 760px;
      }

      .portal-calendar-day {
        min-height: 106px;
      }

    }

    @media print {
      body.print-weekly * {
        visibility: hidden !important;
      }

      body.print-weekly,
      body.print-weekly .shell,
      body.print-weekly #app,
      body.print-weekly #weeklySummaries,
      body.print-weekly #weeklySummaries *,
      body.print-weekly .weekly-print-target,
      body.print-weekly .weekly-print-target * {
        visibility: visible !important;
      }

      body.print-weekly {
        background: #fff !important;
        color: #111 !important;
      }

      body.print-weekly .weekly-print-target {
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        margin: 0;
        background: #fff !important;
        color: #111 !important;
        border: 0 !important;
        box-shadow: none !important;
      }

      body.print-weekly .no-print,
      body.print-weekly details,
      body.print-weekly .weekly-print-target > p.muted {
        display: none !important;
      }

      body.print-weekly .timesheet-wrap {
        overflow: visible !important;
        border-color: #999 !important;
        background: #fff !important;
      }

      body.print-weekly .timesheet {
        min-width: 0 !important;
        table-layout: fixed;
        font-size: 9px;
        color: #111 !important;
      }

      body.print-weekly .timesheet th,
      body.print-weekly .timesheet td,
      body.print-weekly .timesheet .employee-col {
        background: #fff !important;
        color: #111 !important;
        border: 1px solid #999 !important;
      }

      @page {
        size: landscape;
        margin: .35in;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/sefs-icon.jpeg" alt="SEFS">
        <div>
          <h1>Employee Portal</h1>
          <p id="userLine">Sign in to view your schedule and time.</p>
        </div>
      </div>
      <button id="signOutBtn" class="ghost hidden" type="button">Sign Out</button>
    </header>

    <section id="authCard" class="card">
      <h2>Sign In</h2>
      <div id="authMessage" class="notice hidden"></div>
      <form id="loginForm" class="form-grid">
        <div class="full">
          <label>Login Name</label>
          <select id="loginEmail" required>
            <option value="">Loading logins...</option>
          </select>
        </div>
        <div class="full">
          <label>Password</label>
          <div class="password-control">
            <input id="password" type="password" autocomplete="current-password" required>
            <button id="togglePasswordBtn" class="ghost" type="button">Show</button>
          </div>
        </div>
        <div class="actions full">
          <button id="signInBtn" class="primary" type="submit">Sign In</button>
          <button id="magicLinkBtn" class="ghost" type="button">Send Magic Link</button>
        </div>
      </form>
    </section>

    <main id="app" class="hidden">
      <div id="appMessage" class="notice hidden"></div>

      <div class="mobile-tab-select-wrap">
        <label for="mobileTabSelect">Go To</label>
        <select id="mobileTabSelect" aria-label="Employee portal section">
          <option value="schedule">Schedule</option>
          <option value="time">Time</option>
          <option value="entries">Entries</option>
        </select>
      </div>

      <div class="tabs">
        <button class="primary" type="button" data-tab="schedule">Schedule</button>
        <button type="button" data-tab="time">Time</button>
        <button type="button" data-tab="entries">Entries</button>
      </div>

      <section id="managerTopPanel" class="manager-top-stack hidden">
          <div id="managerReviewCard" class="card hidden">
            <h2>Time Review</h2>
            <form id="managerTimeForm" class="form-grid hidden">
              <input id="managerEntryId" type="hidden">
              <div>
                <label>Employee(s)</label>
                <input id="managerEntryEmployee" disabled>
              </div>
              <div>
                <label>Job</label>
                <input id="managerEntryJob" disabled>
              </div>
              <div>
                <label>Date</label>
                <input id="managerEntryDate" type="date" required>
              </div>
              <div>
                <label>Status</label>
                <select id="managerEntryStatus">
                  <option value="draft">Draft</option>

  <script>
    const SB_URL = 'https://wjfewzutxvjbbnnvbylo.supabase.co';

    const ADMIN_FUNCTION_URL = `${SB_URL}/functions/v1/employee-admin`;
    const supa = supabase.createClient(SB_URL, SB_KEY);

    let session = null;

    let jobs = [];

    let scheduleCalendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    let scheduleCalendarInitialized = false;

    let managerEmployees = [];

    let timeSaveInFlight = false;

    let ptoBalance = { accrued: 0, ledger: 0, pending: 0, balance: 0, available: 0 };
    let payRatesColumnAvailable = true;
    let authRefreshTimer = null;
    let loginOptions = [];

    const $ = (id) => document.getElementById(id);
    const DEFAULT_START_TIME = '06:00';
    const today = () => {
      const date = new Date();
      date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
      return date.toISOString().slice(0, 10);
    };
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const money = (value) => `$${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const moneylessJobName = (job) => [job.customer, job.system_type].filter(Boolean).join(' - ') || job.job_name || 'Scheduled job';
    const canEnterCrewTime = () => ['crew_lead', 'manager', 'admin'].includes(profile?.role);
    const canReviewTime = () => ['manager', 'admin'].includes(profile?.role);

    function setMessage(id, text, isError = false) {
      const el = $(id);
      el.textContent = text || '';
      el.className = `notice ${isError ? 'error' : ''} ${text ? '' : 'hidden'}`;
    }

    function setTimeSaveBusy(isBusy) {
      timeSaveInFlight = isBusy;
      const saveButton = $('timeForm').querySelector('button[type="submit"]');
      saveButton.disabled = isBusy;
      $('submitNowBtn').disabled = isBusy;
      saveButton.textContent = isBusy ? 'Saving...' : 'Save Draft';
      $('submitNowBtn').textContent = isBusy ? 'Submitting...' : 'Submit Time';
    }

    function setAuthBusy(isBusy) {
      $('signInBtn').disabled = isBusy;
      $('magicLinkBtn').disabled = isBusy;
      $('signInBtn').textContent = isBusy ? 'Signing In...' : 'Sign In';
    }

    function withTimeout(promise, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(message)), 15000))
      ]);
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(`${value}T00:00:00`);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function dateOnly(value) {
      return new Date(`${value}T00:00:00`);
    }

    function isoDate(date) {
      return date.toISOString().slice(0, 10);
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function payPeriodStart(value = today()) {
      const date = dateOnly(value);
      const offset = (date.getDay() - 3 + 7) % 7;
      return addDays(date, -offset);
    }

    function formatTime(value) {
      if (!value) return '';
      const [hours, minutes] = value.split(':');
      const date = new Date();
      date.setHours(Number(hours || 0), Number(minutes || 0), 0, 0);
      return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    function normalizeQuarterTime(value) {
      if (!value) return '';
      const [hours, minutes] = String(value).split(':').map(Number);
      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return '';
      let total = hours * 60 + minutes;
      total = Math.round(total / 15) * 15;
      if (total >= 24 * 60) total = 0;
      const hh = String(Math.floor(total / 60)).padStart(2, '0');
      const mm = String(total % 60).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function snapTimeInput(id) {
      const input = $(id);
      input.value = normalizeQuarterTime(input.value);
      calculateHours();
    }

    function formatRange(job) {
      const start = formatDate(job.start_date);
      const end = job.end_date && job.end_date !== job.start_date ? ` - ${formatDate(job.end_date)}` : '';
      const times = [formatTime(job.start_time), formatTime(job.end_time)].filter(Boolean).join(' - ');
      return `${start}${end}${times ? `, ${times}` : ''}`;
    }

    function scheduleIsoDate(date) {
      const copy = new Date(date);
      copy.setMinutes(copy.getMinutes() - copy.getTimezoneOffset());
      return copy.toISOString().slice(0, 10);
    }

    function scheduleDate(value) {
      if (!value) return null;
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function scheduleMonthName(date) {
      return date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    }

    function jobAppearsOnDate(job, iso) {
      const target = scheduleDate(iso);
      const start = scheduleDate(job.start_date);
      const end = scheduleDate(job.end_date || job.start_date);
      if (!target || !start) return false;
      return target >= start && target <= (end || start);
    }

    function scheduleJobUrl(job, hash = '') {
      const url = new URL('mobile-job.html', location.href);
      url.searchParams.set('job', job.id);
      url.searchParams.set('crew', '1');
      if (hash) url.hash = hash;
      return url.href;
    }

    function statusClass(status) {
      return String(status || 'draft').toLowerCase();
    }

    function calculateHours() {
      const start = $('startTime').value;
      const end = $('endTime').value;
      if (!start || !end) {
        $('calculatedHours').textContent = '0.00';
        return 0;
      }

      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let minutes = (eh * 60 + em) - (sh * 60 + sm);
      if (minutes < 0) minutes += 24 * 60;
      const hours = Math.round((minutes / 60) * 100) / 100;
      $('calculatedHours').textContent = hours.toFixed(2);
      return hours;
    }

    function deviceInfo() {
      return `${navigator.userAgent || 'unknown'} | ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown timezone'}`;
    }

    function requireProfile() {
      if (!profile?.employee_id) {
        throw new Error('Your login is not linked to an employee record yet. Add a profile row in Supabase first.');
      }
    }

    function timePayload(status = 'draft') {
      requireProfile();
      return {
        employee_id: profile.employee_id,
        user_id: session.user.id,
        job_id: $('jobId').value || null,
        work_date: $('workDate').value,
        start_time: $('startTime').value,
        end_time: $('endTime').value,
        break_minutes: 0,
        notes: $('notes').value.trim() || null,
        status,
        device_info: deviceInfo(),
        change_reason: status === 'submitted' ? 'Submitted from employee portal' : 'Saved from employee portal'
      };
    }

    function normalizeTimeForMatch(value) {
      return String(value || '').slice(0, 5);
    }

    function normalizeJobForMatch(value) {
      return value ? String(value) : '';
    }

    function duplicateTimeEntry(payload, employeeId) {
      if (!employeeId || !payload.work_date || !payload.start_time || !payload.end_time) return null;
      const matches = (entry) => (
        String(entry.employee_id || '') === String(employeeId)
        && normalizeJobForMatch(entry.job_id) === normalizeJobForMatch(payload.job_id)
        && String(entry.work_date || '') === String(payload.work_date)
        && normalizeTimeForMatch(entry.start_time) === normalizeTimeForMatch(payload.start_time)
        && normalizeTimeForMatch(entry.end_time) === normalizeTimeForMatch(payload.end_time)
        && !entry.deleted_at
      );
      return [...entries, ...managerEntries].find(matches) || null;
    }

    async function signIn(email, password) {
      if (!email) throw new Error('Choose a login name.');
      if (!password) throw new Error('Enter your password.');
      const result = await withTimeout(
        supa.auth.signInWithPassword({ email, password }),
        'Login timed out. Check the connection and try again.'
      );
      if (result.error) throw result.error;
      if (!result.data?.session) throw new Error('Supabase did not return a login session.');
      session = result.data.session;
      profile = null;
      jobs = [];
      scheduleJobs = [];
      entries = [];
      entryAuditLogs = [];
      managerEntries = [];
      managerProfiles = [];
      managerEmployees = [];
      payRatesColumnAvailable = true;
      ptoEntries = [];
      ptoBalance = { accrued: 0, ledger: 0, pending: 0, balance: 0, available: 0 };
      crewOptions = [];
      selectedCrewIds = new Set();
      resetForm();
      await refresh();
    }

    async function sendMagicLink(email) {
      if (!email) throw new Error('Choose a login name.');
      const result = await withTimeout(
        supa.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: window.location.href.split('#')[0] }
        }),
        'Magic link request timed out. Check the connection and try again.'
      );
      if (result.error) throw result.error;
    }

    async function loadLoginOptions() {
      try {
        const response = await fetch(ADMIN_FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login_options' })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.error) throw new Error(payload.error || `Could not load logins (${response.status})`);
        loginOptions = payload.options || [];
        renderLoginOptions();
      } catch (error) {
        $('loginEmail').innerHTML = '<option value="">Logins unavailable</option>';
        setMessage('authMessage', `Could not load login names: ${error.message}`, true);
      }
    }

    function renderLoginOptions() {
      if (!loginOptions.length) {
        $('loginEmail').innerHTML = '<option value="">No active logins available</option>';
        return;
      }
      $('loginEmail').innerHTML = '<option value="">Choose login...</option>' + loginOptions
        .map((option) => `<option value="${esc(option.email)}">${esc(option.name)}${option.role ? ` - ${esc(option.role)}` : ''}</option>`)
        .join('');
    }

    async function loadProfile() {
      const result = await supa
        .from('profiles')
        .select('id, employee_id, role, full_name, active')
        .eq('id', session.user.id)
        .maybeSingle();
      if (result.error) throw result.error;
      profile = result.data;
      if (!profile) {
        setMessage('appMessage', 'Signed in, but this user does not have an employee portal profile yet. Create a row in public.profiles and link it to an employee.', true);
      } else if (!profile.active) {
        setMessage('appMessage', 'This employee portal profile is inactive.', true);
      } else {
        setMessage('appMessage', '');
      }
    }

    async function loadJobs() {
      const result = await supa
        .from('jobs')
        .select('id, customer, phone, job_name, address, system_type, square_feet, status, start_date, end_date, start_time, end_time, crew, notes, material_notes, floor_scopes')
        .order('start_date', { ascending: true, nullsFirst: false })
        .order('start_time', { ascending: true });
      if (result.error) throw result.error;
      jobs = (result.data || []).filter((job) => !['Complete', 'Lost', 'Canceled'].includes(job.status));
    }

    async function loadScheduleJobs() {
      const result = await supa
        .from('employee_job_schedule')
        .select('*')
        .eq('assigned_employee_id', profile.employee_id)
        .order('start_date', { ascending: true, nullsFirst: false })
        .order('start_time', { ascending: true });
      if (result.error) throw result.error;
      scheduleJobs = (result.data || []).filter((job) => !['Complete', 'Lost', 'Canceled'].includes(job.status));
      if (!scheduleCalendarInitialized && scheduleJobs.length) {
        const firstScheduled = scheduleJobs.find((job) => job.start_date) || scheduleJobs[0];
        const firstDate = scheduleDate(firstScheduled.start_date) || new Date();
        scheduleCalendarMonth = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
        selectedScheduleJobId = firstScheduled.id;
        scheduleCalendarInitialized = true;
      }
      if (selectedScheduleJobId && !scheduleJobs.some((job) => job.id === selectedScheduleJobId)) {
        selectedScheduleJobId = scheduleJobs[0]?.id || '';
      }
    }

    async function loadEntries() {
      requireProfile();
      const result = await supa
        .from('time_entries')
        .select('*')
        .eq('employee_id', profile.employee_id)
        .order('work_date', { ascending: false })
        .order('created_at', { ascending: false })
        .limit(100);
      if (result.error) throw result.error;
      entries = result.data || [];
    }

    async function loadEntryAuditLogs() {
      if (!entries.length) {
        entryAuditLogs = [];
        return;
      }
      const ids = entries.map((entry) => entry.id);
      const result = await supa
        .from('time_entry_audit_logs')
        .select('id, time_entry_id, action_type, previous_values, new_values, reason, created_at')
        .in('time_entry_id', ids)
        .order('created_at', { ascending: false })
        .limit(100);
      if (result.error) throw result.error;
      entryAuditLogs = result.data || [];
    }

    async function loadPtoEntries() {
      const response = await fetch(ADMIN_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ action: 'pto_list' })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.error) throw new Error(payload.error || `Could not load PTO (${response.status})`);
      ptoEntries = payload.pto_entries || [];
      ptoBalance = payload.pto_balance || { accrued: 0, ledger: 0, pending: 0, balance: 0, available: 0 };
    }

    async function loadManagerReviewData() {
      if (!canReviewTime()) {
        managerEntries = [];
        managerProfiles = [];
        managerEmployees = [];
        return;
      }

      const [
        { data: timeData, error: timeError },
        { data: profileData, error: profileError }
      ] = await Promise.all([
        supa
          .from('time_entries')
          .select('*')
          .is('deleted_at', null)
          .order('work_date', { ascending: false })
          .order('created_at', { ascending: false })
          .limit(150),
        supa
          .from('profiles')
          .select('id, employee_id, role, full_name, active')
          .order('full_name')
      ]);
      if (timeError) throw timeError;
      if (profileError) throw profileError;

      let employeeResult = await supa
        .from('employees')
        .select('id, name, active, hourly_rate')
        .order('name');
      payRatesColumnAvailable = !employeeResult.error;
      if (employeeResult.error) {
        employeeResult = await supa
          .from('employees')
          .select('id, name, active')
          .order('name');
      }
      if (employeeResult.error) throw employeeResult.error;
      managerEntries = timeData || [];
      managerProfiles = profileData || [];
      managerEmployees = employeeResult.data || [];
    }

    async function loadCrewOptionsForJob(jobId) {
      crewOptions = [];
      selectedCrewIds = new Set();
      if (!canEnterCrewTime()) return;
      $('crewTimePanel').classList.remove('hidden');
      $('crewTimeList').innerHTML = '<div class="muted">Loading employees...</div>';

      try {
        const response = await fetch(ADMIN_FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ action: 'job_crew_options', job_id: jobId })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.error) throw new Error(payload.error || `Could not load crew (${response.status})`);
        crewOptions = payload.employees || [];
        renderCrewTimePanel();
      } catch (error) {
        $('crewTimePanel').classList.remove('hidden');
        $('crewTimeList').innerHTML = `<div class="muted">${esc(error.message)}</div>`;
      }
    }

    async function refresh() {
      if (!session) return;
      try {
        await loadProfile();
        if (profile?.active) {
          await Promise.all([loadJobs(), loadScheduleJobs(), loadEntries(), loadPtoEntries()]);
          await loadEntryAuditLogs();
          await loadManagerReviewData();
        }
        render();
      } catch (error) {
        setMessage('appMessage', error.message, true);
      }
    }

    function renderJobOptions() {
      $('jobId').disabled = false;
      $('jobId').innerHTML = `<option value="">Other / No job</option>` + jobs.map((job) => `<option value="${job.id}">${esc(moneylessJobName(job))} - ${esc(formatRange(job))}</option>`).join('');
    }

    function renderCrewTimePanel() {
      if (!canEnterCrewTime()) {
        $('crewTimePanel').classList.add('hidden');
        $('crewTimeList').innerHTML = '';
        return;
      }

      $('crewTimePanel').classList.remove('hidden');
      if (!crewOptions.length) {
        $('crewTimeList').innerHTML = '<div class="muted">No employees available for crew time.</div>';
        return;
      }

      const availableEmployees = crewOptions.filter((employee) => employee.id !== profile?.employee_id);
      const selectedEmployees = crewOptions.filter((employee) => selectedCrewIds.has(employee.id));
      const selectedMarkup = selectedEmployees.length
        ? `<div class="crew-selected">${selectedEmployees.map((employee) => `
            <span class="crew-chip">
              ${esc(employee.name)}
              <button class="ghost" type="button" aria-label="Remove ${esc(employee.name)}" onclick="removeCrewEmployee('${esc(employee.id)}')">&times;</button>
            </span>
          `).join('')}</div>`
        : '<div class="muted">This saves your own time. Add employees here to submit the same hours for them too.</div>';
      const checkboxMarkup = availableEmployees.length
        ? `<div class="crew-check-list">${availableEmployees.map((employee) => `
            <label class="crew-check">
              <input type="checkbox" data-employee-id="${esc(employee.id)}" ${selectedCrewIds.has(employee.id) ? 'checked' : ''} onchange="toggleCrewEmployee('${esc(employee.id)}', this.checked)">
              <span>
                <b>${esc(employee.name)}</b>
                <span class="muted">${esc(employee.role || 'employee')}${employee.assignment_status === 'available' ? ' - available' : ''}</span>
              </span>
            </label>
          `).join('')}</div>`
        : '<div class="muted">No other employees available for crew time.</div>';

      $('crewTimeList').innerHTML = `
        ${checkboxMarkup}
        ${selectedMarkup}
      `;
    }

    let lastCrewOptionJobId = null;

    function ensureCrewOptionsForSelectedJob() {
      if (!canEnterCrewTime()) return;
      const jobId = $('jobId').value || '';
      if (lastCrewOptionJobId === jobId && !$('crewTimePanel').classList.contains('hidden')) return;
      lastCrewOptionJobId = jobId;
      loadCrewOptionsForJob(jobId);
    }

    function renderSchedule() {
      $('scheduleMonthLabel').textContent = scheduleMonthName(scheduleCalendarMonth);
      if (!scheduleJobs.length) {
        $('scheduleList').innerHTML = `
          <div class="muted">No jobs assigned to you yet. Time can still be entered below as Other / No job or against an active job.</div>
        `;
        return;
      }

      if (!selectedScheduleJobId || !scheduleJobs.some((job) => job.id === selectedScheduleJobId)) {
        selectedScheduleJobId = scheduleJobs[0].id;
      }

      const firstOfMonth = new Date(scheduleCalendarMonth.getFullYear(), scheduleCalendarMonth.getMonth(), 1);
      const calendarStart = addDays(firstOfMonth, -firstOfMonth.getDay());
      const todayIso = today();
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const heads = dayNames.map((day) => `<div class="portal-calendar-head">${day}</div>`).join('');
      const days = Array.from({ length: 42 }, (_, index) => {
        const date = addDays(calendarStart, index);
        const iso = scheduleIsoDate(date);
        const dayJobs = scheduleJobs.filter((job) => jobAppearsOnDate(job, iso));
        const classes = [
          'portal-calendar-day',
          date.getMonth() === scheduleCalendarMonth.getMonth() ? '' : 'other-month',
          iso === todayIso ? 'today' : ''
        ].filter(Boolean).join(' ');
        return `
          <div class="${classes}">
            <div class="portal-calendar-date">${date.getDate()}</div>
            ${dayJobs.map((job) => `
              <button
                type="button"
                class="portal-calendar-event ${job.id === selectedScheduleJobId ? 'active' : ''}"
                onclick="selectScheduleJob('${esc(job.id)}')">
                ${esc(moneylessJobName(job))}
                <small>${esc([formatTime(job.start_time), job.address].filter(Boolean).join(' - ') || job.status || 'Scheduled')}</small>
              </button>
            `).join('')}
          </div>
        `;
      }).join('');

      const selectedJob = scheduleJobs.find((job) => job.id === selectedScheduleJobId) || scheduleJobs[0];
      $('scheduleList').innerHTML = `
        <div class="portal-calendar" aria-label="Assigned job calendar">
          <div class="portal-calendar-grid">${heads}${days}</div>
        </div>
        <article class="job-card portal-schedule-detail">
          <header>
            <h3>${esc(moneylessJobName(selectedJob))}</h3>
            <span class="status">${esc(selectedJob.status || 'Scheduled')}</span>
          </header>
          <div class="facts">
            <div class="fact"><b>When</b>${esc(formatRange(selectedJob))}</div>
            <div class="fact"><b>Address</b>${esc(selectedJob.address || '-')}</div>
            <div class="fact"><b>Square Feet</b>${Number(selectedJob.square_feet || 0).toLocaleString()}</div>
            <div class="fact"><b>Crew</b>${esc(selectedJob.crew || '-')}</div>
          </div>
          ${selectedJob.notes ? `<p class="muted">${esc(selectedJob.notes)}</p>` : ''}
          ${selectedJob.material_notes ? `<p class="muted">${esc(selectedJob.material_notes)}</p>` : ''}
          <div class="schedule-actions">
            <a class="button-link" href="${esc(scheduleJobUrl(selectedJob, 'materials'))}" target="_blank" rel="noopener">Material List</a>
          </div>
          <div class="schedule-update-form">
            <label for="scheduleNote_${esc(selectedJob.id)}">Add Job Note</label>
            <textarea id="scheduleNote_${esc(selectedJob.id)}" placeholder="Crew notes, job progress, prep concerns, or anything the office should know."></textarea>
            <label for="schedulePhotos_${esc(selectedJob.id)}">Add Job Photos</label>
            <input id="schedulePhotos_${esc(selectedJob.id)}" type="file" accept="image/*" multiple>
            <div class="actions">
              <button class="primary" type="button" onclick="saveScheduleJobUpdate('${esc(selectedJob.id)}')">Save Note / Photos</button>
            </div>
            <p class="muted">Schedule dates and job details are read-only in the employee portal.</p>
          </div>
        </article>
      `;
    }

    window.shiftScheduleCalendar = function shiftScheduleCalendar(months) {
      scheduleCalendarMonth = new Date(scheduleCalendarMonth.getFullYear(), scheduleCalendarMonth.getMonth() + months, 1);
      renderSchedule();
    };

    window.goToScheduleToday = function goToScheduleToday() {
      const date = new Date();
      scheduleCalendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
      renderSchedule();
    };

    window.selectScheduleJob = function selectScheduleJob(jobId) {
      selectedScheduleJobId = jobId;
      renderSchedule();
    };

    function renderTotals() {
      const submitted = entries.filter((entry) => entry.status === 'submitted').reduce((sum, entry) => sum + Number(entry.total_hours || 0), 0);
      const approved = entries.filter((entry) => entry.status === 'approved').reduce((sum, entry) => sum + Number(entry.total_hours || 0), 0);
      const drafts = entries.filter((entry) => entry.status === 'draft' || entry.status === 'rejected').length;
      $('totals').innerHTML = `
        <div class="total"><span class="muted">Submitted</span><b>${submitted.toFixed(2)}</b></div>
        <div class="total"><span class="muted">Approved</span><b>${approved.toFixed(2)}</b></div>
        <div class="total"><span class="muted">Open Drafts</span><b>${drafts}</b></div>
      `;
    }

    function renderEntries() {
      if (!entries.length) {
        $('entryMode').innerHTML = '';
        $('entryList').innerHTML = '<div class="muted">No time entries yet.</div>';
        return;
      }

      const acceptedEntries = entries.filter((entry) => entry.status !== 'rejected');
      const rejectedEntries = entries.filter((entry) => entry.status === 'rejected');
      const visibleEntries = entryReviewView === 'rejected' ? rejectedEntries : acceptedEntries;
      $('entryMode').innerHTML = `
        <button class="${entryReviewView !== 'rejected' ? 'primary' : ''}" type="button" onclick="setEntryReviewView('accepted')">Accepted / Submitted (${acceptedEntries.length})</button>
        <button class="${entryReviewView === 'rejected' ? 'primary' : ''}" type="button" onclick="setEntryReviewView('rejected')">Rejected (${rejectedEntries.length})</button>
      `;
      if (!visibleEntries.length) {
        $('entryList').innerHTML = `<div class="muted">${entryReviewView === 'rejected' ? 'No rejected time entries.' : 'No accepted or submitted time entries.'}</div>`;
        return;
      }

      $('entryList').innerHTML = visibleEntries.map((entry) => {
        const job = jobs.find((item) => item.id === entry.job_id);
        const canEdit = entry.status === 'draft' || entry.status === 'rejected';
        return `
          <article class="entry-card">
            <header>
              <div>
                <h3>${esc(job ? moneylessJobName(job) : 'Job')}</h3>
                <span class="muted">${esc(formatDate(entry.work_date))} - ${esc(formatTime(entry.start_time))} to ${esc(formatTime(entry.end_time))}</span>
              </div>
              <span class="status ${statusClass(entry.status)}">${esc(entry.status)}</span>
            </header>
            <div class="facts">
              <div class="fact"><b>Total</b>${Number(entry.total_hours || 0).toFixed(2)} hours</div>
              <div class="fact"><b>Job</b>${esc(job ? moneylessJobName(job) : 'Other / No job')}</div>
            </div>
            ${entry.notes ? `<p class="muted">${esc(entry.notes)}</p>` : ''}
            ${entry.rejection_reason ? `<p class="muted">Rejected: ${esc(entry.rejection_reason)}</p>` : ''}
            <div class="actions">
              ${canEdit ? `<button type="button" onclick="editEntry('${entry.id}')">Edit</button><button type="button" onclick="submitEntry('${entry.id}')">Submit</button>` : ''}
              ${entry.status === 'draft' ? `<button class="ghost" type="button" onclick="deleteEntry('${entry.id}')">Delete</button>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    window.setEntryReviewView = function setEntryReviewView(view) {
      entryReviewView = view === 'rejected' ? 'rejected' : 'accepted';
      renderEntries();
    };

    function employeeName(employeeId) {
      const profileItem = managerProfiles.find((item) => item.employee_id === employeeId);
      const employeeItem = managerEmployees.find((item) => item.id === employeeId);
      return profileItem?.full_name || employeeItem?.name || 'Employee';
    }

    function employeeProfile(employeeId) {
      return managerProfiles.find((item) => item.employee_id === employeeId);
    }

    function employeeById(employeeId) {
      return managerEmployees.find((item) => item.id === employeeId);
    }

    function employeeHourlyRate(employeeId) {
      return Number(employeeById(employeeId)?.hourly_rate || 0);
    }

    function employeeIsActiveForPayroll(employeeId) {
      const profileItem = employeeProfile(employeeId);
      if (['manager', 'admin'].includes(profileItem?.role)) return false;
      const employeeItem = employeeById(employeeId);
      if (!employeeItem || employeeItem.active === false) return false;
      return !String(employeeItem.name || '').toLowerCase().startsWith('removed employee');
    }

    function payrollEmployees() {
      return managerEmployees
        .filter((employee) => employeeIsActiveForPayroll(employee.id))
        .sort((a, b) => employeeName(a.id).localeCompare(employeeName(b.id)));
    }

    function jobName(jobId) {
      const job = jobs.find((item) => item.id === jobId);
      return job ? moneylessJobName(job) : 'Other / No job';
    }

    function reviewGroupKey(entry) {
      return [
        entry.status || 'draft',
        entry.job_id || 'other',
        entry.work_date || '',
        String(entry.start_time || '').slice(0, 5),
        String(entry.end_time || '').slice(0, 5),
        Number(entry.total_hours || 0).toFixed(2),
        entry.notes || '',
        entry.rejection_reason || ''
      ].join('|');
    }

    function managerTimeGroups() {
      const grouped = new Map();
      for (const entry of managerEntries) {
        const key = reviewGroupKey(entry);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(entry);
      }
      return Array.from(grouped.values()).map((items) => ({
        id: items.map((entry) => entry.id).join(','),
        entries: items,
        entry: items[0],
        employees: items.map((entry) => employeeName(entry.employee_id)).sort((a, b) => a.localeCompare(b))
      }));
    }

    function groupLabel(group) {
      return group.employees.length > 1 ? `${group.employees.length} employees` : group.employees[0] || 'Employee';
    }

    function renderManagerReview() {
      $('managerReviewCard').classList.toggle('hidden', !canReviewTime());
      if (!canReviewTime()) {
        $('managerTimeList').innerHTML = '';
        $('managerReviewMode').innerHTML = '';
        $('managerReviewFooter').innerHTML = '';
        $('managerTimeForm').classList.add('hidden');
        return;
      }

      const groups = managerTimeGroups();
      const approvedGroups = groups.filter((group) => group.entry.status === 'approved');
      const rejectedGroups = groups.filter((group) => group.entry.status === 'rejected');
      const pendingGroups = groups.filter((group) => !['approved', 'rejected'].includes(group.entry.status));
      const visibleGroups = managerReviewView === 'approved'
        ? approvedGroups
        : managerReviewView === 'rejected'
          ? rejectedGroups
          : pendingGroups;

      $('managerReviewMode').innerHTML = `
        <button class="${managerReviewView === 'pending' ? 'primary' : ''}" type="button" onclick="setManagerReviewView('pending')">Pending Review (${pendingGroups.length})</button>
        <button class="${managerReviewView === 'approved' ? 'primary' : ''}" type="button" onclick="setManagerReviewView('approved')">Approved Time (${approvedGroups.length})</button>
        <button class="${managerReviewView === 'rejected' ? 'primary' : ''}" type="button" onclick="setManagerReviewView('rejected')">Rejected Time (${rejectedGroups.length})</button>
      `;
      $('managerReviewFooter').innerHTML = managerReviewView !== 'pending'
        ? '<button type="button" onclick="setManagerReviewView(\'pending\')">Back to Pending Review</button>'
        : '<button type="button" onclick="setManagerReviewView(\'approved\')">View Approved Time</button><button type="button" onclick="setManagerReviewView(\'rejected\')">View Rejected Time</button>';

      if (!visibleGroups.length) {
        $('managerTimeList').innerHTML = `<div class="muted">${managerReviewView === 'approved' ? 'No approved time entries yet.' : managerReviewView === 'rejected' ? 'No rejected time entries.' : 'No pending time entries to review.'}</div>`;
        return;
      }

      const sortedGroups = [...visibleGroups].sort((a, b) => {
        const statusRank = { submitted: 0, rejected: 1, draft: 2, approved: 3 };
        const aRank = statusRank[a.entry.status] ?? 9;
        const bRank = statusRank[b.entry.status] ?? 9;
        if (aRank !== bRank) return aRank - bRank;
        return String(b.entry.work_date || '').localeCompare(String(a.entry.work_date || ''));
      });

      $('managerTimeList').innerHTML = sortedGroups.map((group) => {
        const entry = group.entry;
        const names = group.employees.join(', ');
        return `
        <article class="entry-card">
          <header>
            <div>
              <h3>${esc(groupLabel(group))}</h3>
              <span class="muted">${esc(jobName(entry.job_id))}</span>
            </div>
            <span class="status ${statusClass(entry.status)}">${esc(entry.status || 'draft')}</span>
          </header>
          <div class="facts">
            <div class="fact"><b>Date</b>${esc(formatDate(entry.work_date))}</div>
            <div class="fact"><b>Time</b>${esc(formatTime(entry.start_time))} - ${esc(formatTime(entry.end_time))}</div>
            <div class="fact"><b>Total</b>${Number(entry.total_hours || 0).toFixed(2)} hours</div>
            <div class="fact"><b>Submitted</b>${entry.submitted_at ? esc(new Date(entry.submitted_at).toLocaleDateString()) : '-'}</div>
          </div>
          <p class="muted">${esc(names)}</p>
          ${entry.notes ? `<p class="muted">${esc(entry.notes)}</p>` : ''}
          ${entry.rejection_reason ? `<p class="muted">Rejected: ${esc(entry.rejection_reason)}</p>` : ''}
          <div class="actions">
            ${entry.status !== 'approved' ? `<button class="primary" type="button" onclick="approveManagerGroup('${esc(group.id)}')">Approve Group</button>` : ''}
            <button type="button" onclick="editManagerGroup('${esc(group.id)}')">Edit Group</button>
          </div>
        </article>
      `;
      }).join('');
    }

    window.setManagerReviewView = function setManagerReviewView(view) {
      managerReviewView = ['approved', 'rejected'].includes(view) ? view : 'pending';
      renderManagerReview();
    };

    function entriesForPeriod(startDate) {
      const start = isoDate(startDate);
      const end = isoDate(addDays(startDate, 6));
      return entries.filter((entry) => entry.work_date >= start && entry.work_date <= end && !entry.deleted_at);
    }

    function periodRangeLabel(startDate) {
      return `${formatDate(isoDate(startDate))} - ${formatDate(isoDate(addDays(startDate, 6)))}`;
    }

    function periodSummary(label, startDate) {
      const periodEntries = entriesForPeriod(startDate);
      const entryIds = new Set(periodEntries.map((entry) => entry.id));
      const changes = entryAuditLogs.filter((log) => entryIds.has(log.time_entry_id) && !['created'].includes(log.action_type));
      const acceptedEntries = periodEntries.filter((entry) => ['approved', 'submitted'].includes(entry.status));
      const total = acceptedEntries.reduce((sum, entry) => sum + Number(entry.total_hours || 0), 0);
      const byJob = new Map();
      for (const entry of acceptedEntries) {
        const job = jobs.find((item) => item.id === entry.job_id);
        const name = job ? moneylessJobName(job) : 'Other / No job';
        byJob.set(name, (byJob.get(name) || 0) + Number(entry.total_hours || 0));
      }

      return `
        <article class="entry-card">
          <header>
            <div>
              <h3>${label}</h3>
              <span class="muted">${esc(periodRangeLabel(startDate))}</span>
            </div>
            <span class="status approved">${total.toFixed(2)} hrs</span>
          </header>
          <details>
            <summary>Job Summary</summary>
            ${byJob.size ? Array.from(byJob.entries()).map(([name, hours]) => `<p class="muted"><b>${esc(name)}</b>: ${hours.toFixed(2)} hrs</p>`).join('') : '<p class="muted">No time logged.</p>'}
          </details>
          ${changes.length ? `<details><summary>Changes</summary>${changes.map((log) => `<p class="muted">${esc(new Date(log.created_at).toLocaleString())} - ${esc(log.action_type)}${log.reason ? `: ${esc(log.reason)}` : ''}</p>`).join('')}</details>` : ''}
        </article>
      `;
    }

    function payPeriodStartOptions() {
      const starts = new Set();
      const thisStart = payPeriodStart(today());
      for (let i = 0; i < 12; i += 1) {
        starts.add(isoDate(addDays(thisStart, -7 * i)));
      }
      for (const entry of managerEntries) {
        if (entry.work_date) starts.add(isoDate(payPeriodStart(entry.work_date)));
      }
      return Array.from(starts).sort((a, b) => b.localeCompare(a));
    }

    function renderPayPeriodControls(options) {
      if (!canReviewTime()) {
        $('payPeriodControls').innerHTML = '';
        return;
      }
      if (!selectedPayPeriodStart || !options.includes(selectedPayPeriodStart)) {
        selectedPayPeriodStart = options[0] || isoDate(payPeriodStart(today()));
      }
      $('payPeriodControls').innerHTML = `
        <label for="payPeriodSelect">Pay Period</label>
        <select id="payPeriodSelect" onchange="setPayPeriodStart(this.value)">
          ${options.map((start) => `<option value="${esc(start)}" ${start === selectedPayPeriodStart ? 'selected' : ''}>${esc(periodRangeLabel(dateOnly(start)))}</option>`).join('')}
        </select>
      `;
    }

    function formatHoursValue(value) {
      const number = Number(value || 0);
      return number ? number.toFixed(2).replace(/\.00$/, '') : '';
    }

    function managerPeriodSummary() {
      const options = payPeriodStartOptions();
      renderPayPeriodControls(options);
      const startDate = dateOnly(selectedPayPeriodStart || options[0] || today());
      const start = isoDate(startDate);
      const end = isoDate(addDays(startDate, 6));
      const days = Array.from({ length: 7 }, (_, index) => {
        const date = addDays(startDate, index);
        const iso = isoDate(date);
        return {
          iso,
          label: date.toLocaleDateString(undefined, { weekday: 'short' }),
          dateLabel: date.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' })
        };
      });
      const periodEntries = managerEntries.filter((entry) => entry.work_date >= start && entry.work_date <= end && !entry.deleted_at);
      const approvedEntries = periodEntries.filter((entry) => entry.status === 'approved' && employeeIsActiveForPayroll(entry.employee_id));
      const employees = new Map();
      const byStatus = new Map();

      for (const entry of approvedEntries) {
        const employeeId = entry.employee_id || 'unknown';
        const name = employeeName(employeeId);
        const hours = Number(entry.total_hours || 0);
        if (!employees.has(employeeId)) {
          employees.set(employeeId, {
            name,
            employeeId,
            hourlyRate: employeeHourlyRate(employeeId),
            dayHours: Object.fromEntries(days.map((day) => [day.iso, 0])),
            total: 0,
            entries: []
          });
        }
        const row = employees.get(employeeId);
        if (row.dayHours[entry.work_date] !== undefined) row.dayHours[entry.work_date] += hours;
        row.total += hours;
        row.entries.push(entry);
        byStatus.set(entry.status || 'draft', (byStatus.get(entry.status || 'draft') || 0) + hours);
      }

      const rows = Array.from(employees.values()).sort((a, b) => a.name.localeCompare(b.name));
      const dayTotals = Object.fromEntries(days.map((day) => [day.iso, 0]));
      let totalHours = 0;
      let regularHours = 0;
      let overtimeHours = 0;
      let regularPayTotal = 0;
      let overtimePayTotal = 0;
      let totalPayTotal = 0;

      for (const row of rows) {
        row.regular = Math.min(row.total, 40);
        row.overtime = Math.max(row.total - 40, 0);
        row.regularPay = row.regular * row.hourlyRate;
        row.overtimePay = row.overtime * row.hourlyRate * 1.5;
        row.totalPay = row.regularPay + row.overtimePay;
        totalHours += row.total;
        regularHours += row.regular;
        overtimeHours += row.overtime;
        regularPayTotal += row.regularPay;
        overtimePayTotal += row.overtimePay;
        totalPayTotal += row.totalPay;
        for (const day of days) dayTotals[day.iso] += row.dayHours[day.iso] || 0;
      }

      const noteEntries = approvedEntries
        .filter((entry) => entry.notes)
        .sort((a, b) => String(a.work_date || '').localeCompare(String(b.work_date || '')) || employeeName(a.employee_id).localeCompare(employeeName(b.employee_id)));
      const noteGroups = new Map();
      for (const entry of noteEntries) {
        const key = reviewGroupKey(entry);
        if (!noteGroups.has(key)) noteGroups.set(key, []);
        noteGroups.get(key).push(entry);
      }
      const notesByDay = Object.fromEntries(days.map((day) => [day.iso, []]));
      const groupedNotes = Array.from(noteGroups.values())
        .map((items) => ({
          entry: items[0],
          employees: items.map((entry) => employeeName(entry.employee_id)).sort((a, b) => a.localeCompare(b))
        }))
        .sort((a, b) => String(a.entry.work_date || '').localeCompare(String(b.entry.work_date || '')) || String(a.entry.start_time || '').localeCompare(String(b.entry.start_time || '')));
      for (const group of groupedNotes) {
        if (notesByDay[group.entry.work_date]) notesByDay[group.entry.work_date].push(group);
      }

      return `
        <article class="entry-card weekly-print-target">
          <div class="weekly-tools">
          <header>
            <div>
              <h3>Weekly Timesheet</h3>
              <span class="muted">${esc(periodRangeLabel(startDate))}</span>
            </div>
            <span class="status approved">${totalHours.toFixed(2)} hrs</span>
          </header>
          <button class="ghost no-print" type="button" onclick="printWeeklyTimesheet()">Share / Save PDF</button>
          </div>
          <div class="timesheet-wrap">
            <table class="timesheet">
              <thead>
                <tr>
                  <th class="employee-col">Employee</th>
                  ${days.map((day) => `<th>${esc(day.label)}<br>${esc(day.dateLabel)}</th>`).join('')}
                  <th>Total<br>Hours</th>
                  <th>Reg<br>Time</th>
                  <th>Over<br>Time</th>
                  <th>Reg<br>Pay</th>
                  <th>OT<br>Pay</th>
                  <th>Total<br>Pay</th>
                  <th>Hourly<br>Rate</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows.map((row) => `
                  <tr>
                    <td class="employee-col">${esc(row.name)}</td>
                    ${days.map((day) => `<td>${esc(formatHoursValue(row.dayHours[day.iso]))}</td>`).join('')}
                    <td class="total-col">${row.total.toFixed(2)}</td>
                    <td>${row.regular.toFixed(2)}</td>
                    <td class="overtime-col">${row.overtime ? row.overtime.toFixed(2) : ''}</td>
                    <td class="pay-col">${money(row.regularPay)}</td>
                    <td class="pay-col">${row.overtimePay ? money(row.overtimePay) : ''}</td>
                    <td class="pay-col">${money(row.totalPay)}</td>
                    <td>${money(row.hourlyRate)}</td>
                  </tr>
                `).join('') : `<tr><td class="employee-col">No approved hours</td><td colspan="14" class="muted">No approved time logged for this pay period.</td></tr>`}
              </tbody>
              <tfoot>
                <tr class="timesheet-foot">
                  <td class="employee-col">Totals</td>
                  ${days.map((day) => `<td>${esc(formatHoursValue(dayTotals[day.iso]))}</td>`).join('')}
                  <td>${totalHours.toFixed(2)}</td>
                  <td>${regularHours.toFixed(2)}</td>
                  <td>${overtimeHours.toFixed(2)}</td>
                  <td>${money(regularPayTotal)}</td>
                  <td>${money(overtimePayTotal)}</td>
                  <td>${money(totalPayTotal)}</td>
                  <td></td>
                </tr>
                <tr class="timesheet-notes-row">
                  <td class="employee-col">Notes</td>
                  ${days.map((day) => `
                    <td>
                      ${notesByDay[day.iso].length ? notesByDay[day.iso].map((group) => `
                        <div class="timesheet-note">
                          <b>${esc(groupLabel(group))}</b><br>
                          <span class="muted">${esc(jobName(group.entry.job_id))} - ${esc(formatTime(group.entry.start_time))} to ${esc(formatTime(group.entry.end_time))}</span><br>
                          ${esc(group.entry.notes)}
                        </div>
                      `).join('') : '<span class="muted">No notes.</span>'}
                    </td>
                  `).join('')}
                  <td colspan="7" class="muted">Notes are grouped by work day.</td>
                </tr>
              </tfoot>
            </table>
          </div>

    async function uploadTimePhotos(entry, jobId) {
      const input = $('timePhotos');
      if (!input?.files?.length) return '';

      const files = Array.from(input.files);
      const targetType = jobId ? 'job' : 'time_entry';
      const targetId = jobId || entry.id;
      const safeName = (name) => name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const uploadedBy = profile?.full_name || session?.user?.email || 'employee-portal';

      for (const file of files) {
        const path = `${targetType}/${targetId}/time-entry/${entry.id}/${Date.now()}_${safeName(file.name)}`;
        const upload = await supa.storage.from('sefs-photos').upload(path, file, { upsert: false });
        if (upload.error) throw new Error(upload.error.message);

        const publicUrl = supa.storage.from('sefs-photos').getPublicUrl(path).data.publicUrl;
        const caption = jobId
          ? `Time entry photo - ${formatDate(entry.work_date)}`
          : `Other time entry photo - ${formatDate(entry.work_date)}`;
        const saved = await supa.from('photo_attachments').insert({
          entity_type: targetType,
          entity_id: targetId,
          file_name: file.name,
          storage_path: path,
          public_url: publicUrl,
          caption,
          category: 'time-entry',
          uploaded_by: uploadedBy
        });
        if (saved.error) throw new Error(saved.error.message);
      }

      return `${files.length} photo${files.length === 1 ? '' : 's'} uploaded${jobId ? ' and attached to the job' : ' to the time entry'}.`;
    }

    async function saveTime(status) {
      if (timeSaveInFlight) return;
      setTimeSaveBusy(true);
      try {
        const id = $('entryId').value;
        const payload = timePayload(status);
        let result;
        let savedEntry;
        let skippedDuplicates = [];
        let photoStatus = '';
        
        const crewEmployeeIds = selectedCrewEmployeeIds();
        if (!id && crewEmployeeIds.length) {
          const duplicateEmployees = crewEmployeeIds.filter((employeeId) => duplicateTimeEntry(payload, employeeId));
          const employeeIdsToSave = crewEmployeeIds.filter((employeeId) => !duplicateEmployees.includes(employeeId));
          if (!employeeIdsToSave.length) {
            throw new Error('Time already submitted for this employee/group and time.');
          }
          selectedCrewIds = new Set(employeeIdsToSave.filter((employeeId) => employeeId !== profile?.employee_id));
          const saveResult = await saveCrewTimeEntries(payload, employeeIdsToSave);
          const savedEntries = saveResult.time_entries || [];
          skippedDuplicates = [...duplicateEmployees, ...(saveResult.skipped_duplicates || [])];
          savedEntry = savedEntries[0];
          if (!savedEntry && skippedDuplicates.length) {
            throw new Error('Time already submitted for this employee/group and time.');
          }
          if (!savedEntry) throw new Error('No crew time entries were saved.');
          photoStatus = await uploadTimePhotos(savedEntry, savedEntry.job_id);
        } else if (id) {
          result = await supa.from('time_entries').update(payload).eq('id', id).select().single();
          if (result.error) throw result.error;
          savedEntry = result.data;
          photoStatus = await uploadTimePhotos(savedEntry, savedEntry.job_id);
        } else {
          if (duplicateTimeEntry(payload, profile.employee_id)) {
            throw new Error('Time already submitted for this employee and time.');
          }
          result = await supa.from('time_entries').insert(payload).select().single();
          if (result.error) throw result.error;
          savedEntry = result.data;
          photoStatus = await uploadTimePhotos(savedEntry, savedEntry.job_id);
        }
        resetForm();
        await refresh();
        const savedMessage = status === 'submitted' ? 'Time submitted.' : 'Time entry saved.';
        const duplicateMessage = skippedDuplicates.length
          ? ` Skipped ${new Set(skippedDuplicates).size} duplicate employee time entr${new Set(skippedDuplicates).size === 1 ? 'y' : 'ies'}.`
          : '';
        setMessage('appMessage', `${savedMessage}${duplicateMessage}${photoStatus ? ` ${photoStatus}` : ''}`);
        setActiveTab('entries');
      } catch (error) {
        setMessage('appMessage', error.message, true);
      } finally {
        setTimeSaveBusy(false);
      }
    }

    async function requestPto() {
      const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
      if ($('ptoDate').value < tomorrow) throw new Error('PTO requests must be for a future date.');
      const hours = Number($('ptoHours').value || 0);
      const available = Math.max(0, Number(ptoBalance.available || 0));
      if (!Number.isFinite(hours) || hours <= 0) throw new Error('PTO hours must be greater than zero.');
      if (hours > available + 0.001) throw new Error(`Only ${available.toFixed(2)} PTO hours are available.`);
      const response = await fetch(ADMIN_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({
          action: 'pto_request',
          request_date: $('ptoDate').value,
          hours,
          notes: $('ptoNotes').value.trim() || null
        })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.error) throw new Error(payload.error || `PTO request failed (${response.status})`);
    }

    window.decidePto = async function decidePto(id, status, managerNote = '') {
      try {
        setMessage('appMessage', `Updating PTO ${status}...`);
        const response = await fetch(ADMIN_FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ action: 'pto_decision', id, status, manager_note: managerNote })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.error) throw new Error(payload.error || `PTO update failed (${response.status})`);
        setMessage('appMessage', `PTO ${status}.`);
        await refresh();
      } catch (error) {
        setMessage('appMessage', error.message, true);
      }
    };

    $('ptoSummary').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-pto-id][data-pto-status]');
      if (!button) return;
      const id = button.dataset.ptoId;
      const status = button.dataset.ptoStatus;
      const noteInput = Array.from(document.querySelectorAll('[data-pto-note]')).find((input) => input.dataset.ptoNote === id);
      button.disabled = true;
      await window.decidePto(id, status, noteInput?.value?.trim() || '');
      button.disabled = false;
    });

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setMessage('authMessage', 'Signing in...');
      setAuthBusy(true);
      try {
        await signIn($('loginEmail').value, $('password').value);
        setMessage('authMessage', '');
      } catch (error) {
        setMessage('authMessage', error.message, true);
      } finally {
        setAuthBusy(false);
      }
    });

    $('magicLinkBtn').addEventListener('click', async () => {
      setMessage('authMessage', 'Sending magic link...');
      setAuthBusy(true);
      try {
        await sendMagicLink($('loginEmail').value);
        setMessage('authMessage', 'Magic link sent. Check your email on this device.');
      } catch (error) {
        setMessage('authMessage', error.message, true);
      } finally {
        setAuthBusy(false);
      }
    });

    $('togglePasswordBtn').addEventListener('click', () => {
      const input = $('password');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      $('togglePasswordBtn').textContent = isHidden ? 'Hide' : 'Show';
      input.focus();
    });

    $('signOutBtn').addEventListener('click', async () => {
      await supa.auth.signOut();
    });

    $('timeForm').addEventListener('submit', (event) => {
      event.preventDefault();
      saveTime('draft');
    });

    $('ptoForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await requestPto();
        $('ptoHours').value = '';
        $('ptoNotes').value = '';
        setMessage('appMessage', 'PTO request submitted.');
        await refresh();
      } catch (error) {
        setMessage('appMessage', error.message, true);
      }
    });

    $('managerTimeForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const id = $('managerEntryId').value;
        const status = $('managerEntryStatus').value;
        await updateManagerTimeEntries(id, {
          work_date: $('managerEntryDate').value,
          start_time: $('managerEntryStart').value,
          end_time: $('managerEntryEnd').value,
          notes: $('managerEntryNotes').value.trim() || null,
          status,
          rejection_reason: status === 'rejected' ? $('managerEntryRejectReason').value.trim() || null : null,
          change_reason: $('managerEntryChangeReason').value.trim() || `Manager edit from employee portal by ${profile?.full_name || session?.user?.email || 'manager'}`
        });
        $('managerTimeForm').classList.add('hidden');
        setMessage('appMessage', 'Time entry saved and logged.');
        await refresh();
      } catch (error) {
        setMessage('appMessage', error.message, true);
      }
    });

    $('submitNowBtn').addEventListener('click', () => saveTime('submitted'));
    $('cancelEditBtn').addEventListener('click', resetForm);
    $('cancelManagerEditBtn').addEventListener('click', () => $('managerTimeForm').classList.add('hidden'));
    $('jobId').addEventListener('change', () => {
      lastCrewOptionJobId = null;
      ensureCrewOptionsForSelectedJob();
    });
    ['startTime', 'endTime'].forEach((id) => {
      $(id).addEventListener('input', calculateHours);
      $(id).addEventListener('change', () => snapTimeInput(id));
      $(id).addEventListener('blur', () => snapTimeInput(id));
    });
    $('mobileTabSelect').addEventListener('change', (event) => setActiveTab(event.target.value));
    document.querySelectorAll('[data-tab]').forEach((button) => button.addEventListener('click', () => setActiveTab(button.dataset.tab)));

    supa.auth.onAuthStateChange((_event, nextSession) => {
      session = nextSession;
      profile = null;
      jobs = [];
      scheduleJobs = [];
      entries = [];
      managerEntries = [];
      managerProfiles = [];
      managerEmployees = [];
      ptoEntries = [];
      ptoBalance = { accrued: 0, ledger: 0, pending: 0, balance: 0, available: 0 };
      clearTimeout(authRefreshTimer);
      if (session) {
        authRefreshTimer = setTimeout(async () => {
          resetForm();
          await refresh();
        }, 0);
      } else {
        render();
      }
    });

    (async function init() {
      $('workDate').value = today();
      $('startTime').value = DEFAULT_START_TIME;
      await loadLoginOptions();
      const result = await supa.auth.getSession();
      session = result.data.session;
      if (session) {
        await refresh();
      } else {
        render();
      }
    })();
  </script>
</body>
</html>
